<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头图（Medium 风格）— Hermes vs OpenClaw</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0E0E10; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 20px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.92); padding: 14px 20px;
    display: flex; gap: 12px; justify-content: center; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .toolbar button {
    background: #C4956A; color: #1C1C1E; border: none;
    padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .toolbar button:hover { background: #d4a57a; }

  .cover {
    width: 900px; height: 383px; position: relative; overflow: hidden;
    border-radius: 8px;
  }
  .bg-dark { position: absolute; inset: 0; background: #1C1C1E; }

  .hero-art {
    position: absolute; right: 48px; top: 50%; transform: translateY(-50%);
    z-index: 1;
  }

  .brand {
    position: absolute; top: 22px; left: 28px;
    display: flex; align-items: center; gap: 8px; z-index: 3;
  }
  .brand svg { width: 22px; height: 22px; }
  .brand-text {
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.45); letter-spacing: 1px;
  }

  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 380px 0 60px; z-index: 2;
  }

  .kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
    color: #C4956A; text-transform: uppercase;
    padding-top: 12px; position: relative;
    margin-bottom: 18px;
  }
  .kicker::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 32px; height: 1px; background: #C4956A;
  }

  .title {
    font-size: 38px; font-weight: 800; letter-spacing: -0.022em;
    line-height: 1.18; color: #F2EDE3;
  }
  .title .vs {
    font-size: 26px; font-weight: 400; font-style: italic;
    color: rgba(255,255,255,0.45);
    margin: 0 8px; vertical-align: 4px;
  }
  .title .accent { color: #C4956A; }

  .lede {
    font-size: 17px; font-weight: 400; font-style: italic;
    color: rgba(255,255,255,0.55);
    margin-top: 20px; max-width: 460px; line-height: 1.55;
    letter-spacing: 0.2px;
  }

  .preview-secondary-hint {
    margin-top: 24px; font-size: 12px; color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="downloadCover('main')">下载头图 (900×383)</button>
  <button onclick="downloadCover('secondary')">下载次图 (200×200)</button>
</div>

<div class="cover" id="cover-main">
  <div class="bg-dark"></div>

  <!-- 焦点视觉：分层架构 — 控制面 / 执行面 -->
  <div class="hero-art">
    <svg width="320" height="260" viewBox="0 0 320 260" fill="none">
      <!-- 顶部坐标线 -->
      <line x1="20" y1="20" x2="300" y2="20" stroke="#F2EDE3" stroke-width="0.6" opacity="0.2" stroke-dasharray="2,3"/>
      <text x="20" y="14" font-size="8" fill="rgba(255,255,255,0.35)" font-family="SF Mono, Menlo, monospace" letter-spacing="1">AGENT STACK</text>

      <!-- 控制面（OpenClaw）— 上层宽框 -->
      <rect x="40" y="40" width="240" height="74" rx="4"
            fill="rgba(242,237,227,0.04)" stroke="rgba(242,237,227,0.5)" stroke-width="1"/>
      <text x="56" y="60" font-size="9" fill="rgba(242,237,227,0.5)" font-family="SF Mono, Menlo, monospace" letter-spacing="1.5">CONTROL · GATEWAY</text>
      <text x="56" y="84" font-size="20" fill="rgba(242,237,227,0.9)" font-family="-apple-system, sans-serif" font-weight="800" letter-spacing="-0.02em">OpenClaw</text>
      <!-- 渠道点阵 -->
      <g fill="rgba(242,237,227,0.5)">
        <circle cx="178" cy="78" r="2.4"/>
        <circle cx="190" cy="78" r="2.4"/>
        <circle cx="202" cy="78" r="2.4"/>
        <circle cx="214" cy="78" r="2.4"/>
        <circle cx="226" cy="78" r="2.4"/>
        <circle cx="238" cy="78" r="2.4"/>
        <circle cx="250" cy="78" r="2.4"/>
        <circle cx="178" cy="90" r="2.4"/>
        <circle cx="190" cy="90" r="2.4"/>
        <circle cx="202" cy="90" r="2.4"/>
        <circle cx="214" cy="90" r="2.4"/>
      </g>
      <text x="178" y="106" font-size="7" fill="rgba(255,255,255,0.4)" font-family="SF Mono, Menlo, monospace" letter-spacing="1">11+ CHANNELS</text>

      <!-- 中间 ACP 协议线 -->
      <line x1="160" y1="114" x2="160" y2="146" stroke="#C4956A" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>
      <rect x="138" y="124" width="44" height="14" rx="2" fill="rgba(196,149,106,0.18)" stroke="#C4956A" stroke-width="0.6"/>
      <text x="160" y="134" font-size="8" fill="#C4956A" text-anchor="middle"
            font-family="SF Mono, Menlo, monospace" font-weight="700" letter-spacing="0.5">ACP</text>

      <!-- 执行面（Hermes）— 下层金框 -->
      <rect x="40" y="146" width="240" height="74" rx="4"
            fill="rgba(196,149,106,0.08)" stroke="#C4956A" stroke-width="1.5"/>
      <text x="56" y="166" font-size="9" fill="#C4956A" font-family="SF Mono, Menlo, monospace" letter-spacing="1.5">EXEC · LEARNING LOOP</text>
      <text x="56" y="190" font-size="20" fill="#F2EDE3" font-family="-apple-system, sans-serif" font-weight="800" letter-spacing="-0.02em">Hermes</text>
      <!-- 进化箭头小循环 -->
      <g stroke="#C4956A" stroke-width="1.2" fill="none" stroke-linecap="round">
        <path d="M186 188 a10 10 0 1 1 -10 -10" />
        <polygon points="186,178 188,190 178,186" fill="#C4956A" stroke="none"/>
      </g>
      <text x="206" y="192" font-size="9" fill="rgba(196,149,106,0.85)" font-family="SF Mono, Menlo, monospace" letter-spacing="1">SKILL EVOLVE</text>
      <text x="56" y="206" font-size="7" fill="rgba(255,255,255,0.4)" font-family="SF Mono, Menlo, monospace" letter-spacing="1">SANDBOX · SUBAGENT · ROLLBACK</text>

      <!-- 底部 axis 标签 -->
      <line x1="20" y1="240" x2="300" y2="240" stroke="#F2EDE3" stroke-width="0.6" opacity="0.2"/>
      <text x="160" y="254" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="middle"
            font-family="SF Mono, Menlo, monospace" letter-spacing="1">CONTROL PLANE  ·  EXECUTION PLANE</text>
    </svg>
  </div>

  <!-- 品牌角标 -->
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="13" cy="16" r="10" stroke="rgba(255,255,255,0.5)" stroke-width="2.2" fill="none"/>
      <ellipse cx="13" cy="8.5" rx="7" ry="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" fill="none"/>
      <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/>
      <polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/>
      <circle cx="16" cy="16.3" r="0.7" fill="#F2EDE3"/>
      <line x1="26" y1="4" x2="26" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
      <path d="M26 16 Q26 22 22 22" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="26" cy="4" r="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="brand-text">墨筝</span>
  </div>

  <!-- 内容（左对齐） -->
  <div class="content">
    <div class="kicker">AI AGENT · FRAMEWORK</div>
    <h1 class="title"><span class="accent">Hermes</span><span class="vs">vs</span><span class="accent">OpenClaw</span><br/>选执行面，还是选控制面</h1>
    <p class="lede">学习型智能体 vs 消息网关——Agent 框架的分层选型，不必二选一。</p>
  </div>
</div>

<div class="preview-secondary-hint">↑ 主图（900×383）｜次图自动从左下裁切 kicker + 标题区域</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
function flattenAlpha(canvas, bgColor) {
  const isTransparent = !bgColor || bgColor === 'transparent' || bgColor === 'rgba(0, 0, 0, 0)';
  const flat = document.createElement('canvas');
  flat.width = canvas.width; flat.height = canvas.height;
  const ctx = flat.getContext('2d');
  ctx.fillStyle = isTransparent ? '#1C1C1E' : bgColor;
  ctx.fillRect(0, 0, flat.width, flat.height);
  ctx.drawImage(canvas, 0, 0);
  return flat;
}

async function renderSlide(el) {
  const origRadius = el.style.borderRadius;
  el.style.borderRadius = '0';
  const bgEl = el.querySelector('.bg-light, .bg-dark');
  const bg = bgEl ? getComputedStyle(bgEl).backgroundColor : getComputedStyle(el).backgroundColor;
  const raw = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: null });
  el.style.borderRadius = origRadius;
  return flattenAlpha(raw, bg);
}

async function downloadCover(type) {
  const el = document.getElementById('cover-main');
  const canvas = await renderSlide(el);
  if (type === 'main') {
    canvas.toBlob(blob => saveAs(blob, 'openclaw-hermes-头图.png'), 'image/png');
  } else {
    const SRC_X = 100;
    const SRC_Y = 130;
    const SRC_SIZE = 500;
    const crop = document.createElement('canvas');
    crop.width = 400; crop.height = 400;
    const ctx = crop.getContext('2d');
    ctx.drawImage(canvas, SRC_X, SRC_Y, SRC_SIZE, SRC_SIZE, 0, 0, 400, 400);
    crop.toBlob(blob => saveAs(blob, 'openclaw-hermes-次图.png'), 'image/png');
  }
}
</script>
</body>
</html>
