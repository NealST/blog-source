<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>LangCache 正文配图</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:70px 20px 80px;background:#111;display:flex;flex-direction:column;align-items:center;font-family:"PingFang SC","Microsoft YaHei",sans-serif}.toolbar{position:fixed;z-index:20;top:0;left:0;right:0;padding:12px 24px;background:#222;color:#fff}.toolbar button{border:0;border-radius:6px;padding:9px 16px;background:#C4956A;color:#fff;font-weight:700;cursor:pointer}.slide-label{width:800px;margin:34px 0 10px;color:rgba(255,255,255,.52);font-size:13px}.slide{width:800px;position:relative;overflow:hidden;border-radius:0}.slide.light{background:#FFFFFF}.content{position:relative;padding:56px 52px 62px}.brand{position:absolute;top:17px;left:22px;font-size:10px;font-weight:700;letter-spacing:1px}.light .brand{color:rgba(28,28,30,.4)}.page{position:absolute;right:22px;bottom:17px;font-size:10px}.light .page{color:rgba(28,28,30,.25)}.tag{color:#C4956A;font-size:11px;font-weight:800;letter-spacing:2px;border-top:1px solid #C4956A;padding-top:8px;display:inline-block}.title{margin:14px 0 7px;font-size:29px;line-height:1.3;font-weight:800;letter-spacing:0}.light .title{color:#1C1C1E}.sub{font-size:13px;line-height:1.6;margin-bottom:26px}.light .sub{color:rgba(28,28,30,.55)}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metric{padding:24px;border-radius:8px;border:1px solid #e5e0d7;background:#fff}.metric.cache{background:#F5EFE4;border-color:rgba(196,149,106,.4)}.metric-label{font-size:12px;font-weight:800;color:#666}.metric-value{margin:9px 0 4px;font-size:38px;font-weight:900;color:#1C1C1E}.metric.cache .metric-value{color:#A07848}.metric-note{font-size:11px;color:#777;line-height:1.5}.saving{margin-top:20px;padding:15px 18px;border-radius:7px;background:#1C1C1E;color:#F2EDE3;display:flex;justify-content:space-between;align-items:center}.saving strong{color:#C4956A;font-size:23px}.saving span{font-size:12px;color:rgba(255,255,255,.58)}
</style>
</head>
<body>
<div class="toolbar"><button onclick="downloadAll()">下载全部品牌配图</button></div>

<div class="slide-label">配图 2 · 放在「Redis 在 0.373 秒内返回了之前的回答，没有消耗任何大语言模型的输入或输出 Token。」之后</div>
<div class="slide light" data-num="2" style="min-height:430px">
  <div class="brand">墨筝</div><div class="page">1/1</div>
  <div class="content">
    <div class="tag">TEST RESULT</div>
    <div class="title">这次测试，缓存响应约快 6 倍</div>
    <div class="sub">同一个问题换一种表达，对比直接推理与 LangCache 命中结果</div>
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">直接调用大模型</div><div class="metric-value">2.232s</div><div class="metric-note">514 输入 Token<br>250 输出 Token</div></div>
      <div class="metric cache"><div class="metric-label">Redis LangCache</div><div class="metric-value">0.373s</div><div class="metric-note">0 输入 Token<br>0 输出 Token</div></div>
    </div>
    <div class="saving"><span>本次实测响应速度</span><strong>约 6×</strong><span>官方数据：成本最高节省 90%</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
function flattenAlpha(canvas,bg){const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const ctx=out.getContext('2d');ctx.fillStyle=bg;ctx.fillRect(0,0,out.width,out.height);ctx.drawImage(canvas,0,0);return out}
async function render(el){const bg=getComputedStyle(el).backgroundColor;const raw=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:null});return flattenAlpha(raw,bg)}
async function downloadAll(){const zip=new JSZip();const slides=document.querySelectorAll('.slide');for(const slide of slides){const canvas=await render(slide);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));zip.file(`配图-${slide.dataset.num}.png`,blob)}saveAs(await zip.generateAsync({type:'blob'}),'redis-langcache-illustrations.zip')}
</script>
</body>
</html>
