<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面 - pxpipe 如何减少 53% 输入 Token</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;flex-direction:column;align-items:center;padding:70px 20px 80px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.toolbar{position:fixed;inset:0 0 auto;background:rgba(0,0,0,.9);padding:12px 24px;z-index:9}
.toolbar button{padding:8px 16px;border:0;border-radius:6px;background:#C4956A;color:#fff;font-weight:600;cursor:pointer}
.cover{width:900px;height:383px;position:relative;overflow:hidden;border-radius:8px;background:#1C1C1E}
.bg-dark{position:absolute;inset:0;background:#1C1C1E}
.brand{position:absolute;top:20px;left:24px;display:flex;align-items:center;gap:8px;z-index:3}
.brand svg{width:22px;height:22px}.brand span{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px}
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 390px 0 70px;z-index:2}
.kicker{font-size:11px;font-weight:700;letter-spacing:.18em;color:#C4956A;padding-top:10px;position:relative}
.kicker:before{content:"";position:absolute;top:0;left:0;width:32px;height:1px;background:#C4956A}
.title{font-size:45px;font-weight:800;letter-spacing:-.022em;line-height:1.18;color:#F2EDE3;margin-top:18px}
.title .hook{font-size:72px;color:#C4956A;letter-spacing:-.04em}
.lede{font-size:15px;font-style:italic;color:rgba(255,255,255,.55);line-height:1.55;margin-top:14px}
.hero{position:absolute;right:42px;top:50%;transform:translateY(-50%);z-index:1}
.foot{position:absolute;right:30px;bottom:24px;font-size:11px;color:rgba(255,255,255,.28);letter-spacing:1px}
</style>
</head>
<body>
<div class="toolbar"><button onclick="downloadCover('main')">下载头图</button> <button onclick="downloadCover('secondary')">下载次图</button></div>
<div class="cover" id="cover-main">
  <div class="bg-dark"></div>
  <div class="hero">
    <svg width="330" height="270" viewBox="0 0 330 270" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="18" y="35" width="120" height="198" rx="12" fill="rgba(255,255,255,.035)" stroke="rgba(255,255,255,.16)"/>
        <text x="36" y="60" fill="rgba(255,255,255,.42)" stroke="none" font-size="10" font-family="ui-monospace,monospace">DENSE TEXT</text>
        <g stroke="rgba(255,255,255,.34)" stroke-width="3">
          <path d="M36 82h84M36 96h70M36 110h82M36 124h62M36 138h78M36 152h68M36 166h84M36 180h72"/>
        </g>
        <path d="M148 134h44" stroke="#C4956A" stroke-width="2"/>
        <path d="M182 125l12 9-12 9" stroke="#C4956A" stroke-width="2"/>
        <rect x="201" y="77" width="108" height="114" rx="12" fill="rgba(196,149,106,.09)" stroke="#C4956A" stroke-width="1.5"/>
        <g stroke="rgba(242,237,227,.55)" stroke-width="2">
          <path d="M218 98h73M218 111h62M218 124h72M218 137h55M218 150h67M218 163h58"/>
        </g>
        <text x="255" y="214" text-anchor="middle" fill="#C4956A" stroke="none" font-size="34" font-weight="800" font-family="-apple-system,sans-serif">−53%</text>
        <text x="255" y="232" text-anchor="middle" fill="rgba(255,255,255,.38)" stroke="none" font-size="10" letter-spacing="1" font-family="-apple-system,sans-serif">INPUT TOKEN</text>
      </g>
    </svg>
  </div>
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="13" cy="16" r="10" stroke="rgba(255,255,255,.5)" stroke-width="2.2"/><ellipse cx="13" cy="8.5" rx="7" ry="1.5" stroke="rgba(255,255,255,.3)" stroke-width="1.2"/><ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/><polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/><circle cx="16" cy="16.3" r=".7" fill="#F2EDE3"/><line x1="26" y1="4" x2="26" y2="16" stroke="rgba(255,255,255,.5)" stroke-width="2"/><path d="M26 16Q26 22 22 22" stroke="rgba(255,255,255,.5)" stroke-width="2"/><circle cx="26" cy="4" r="2" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/></svg>
    <span>墨筝</span>
  </div>
  <div class="content">
    <div class="kicker">PXPIPE · CLAUDE CODE</div>
    <h1 class="title">把输入 Token<br>减少 <span class="hook">53%</span></h1>
    <p class="lede">把高密度上下文渲染成图片，省 Token，也带来字符误读风险</p>
  </div>
  <div class="foot">TEXT → PNG · LOCAL PROXY</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
function flattenAlpha(canvas,bgColor){const flat=document.createElement("canvas");flat.width=canvas.width;flat.height=canvas.height;const ctx=flat.getContext("2d");ctx.fillStyle=(!bgColor||bgColor==="transparent")?"#1C1C1E":bgColor;ctx.fillRect(0,0,flat.width,flat.height);ctx.drawImage(canvas,0,0);return flat}
async function renderSlide(el){const r=el.style.borderRadius;el.style.borderRadius="0";const bg=getComputedStyle(el.querySelector(".bg-dark")).backgroundColor;const raw=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:null});el.style.borderRadius=r;return flattenAlpha(raw,bg)}
async function downloadCover(type){const c=await renderSlide(document.getElementById("cover-main"));if(type==="main"){c.toBlob(b=>saveAs(b,"pxpipe-cover-900x383.png"),"image/png");return}const crop=document.createElement("canvas");crop.width=400;crop.height=400;crop.getContext("2d").drawImage(c,80,(c.height-400)/2,400,400,0,0,400,400);crop.toBlob(b=>saveAs(b,"pxpipe-cover-200x200.png"),"image/png")}
</script>
</body>
</html>
