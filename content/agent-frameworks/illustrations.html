<div class="slide-label">配图 1 · 放在「是否真的需要 Agent 框架」之后</div>
<div class="slide" data-num="1"><svg viewBox="0 0 960 600" role="img" aria-labelledby="i1-title i1-desc"><title id="i1-title">Agent 上线所需的四项能力</title><desc id="i1-desc">基础循环需要持久化、人机协同、可观测性和沙盒隔离。</desc><defs><marker id="i1-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a7876"/></marker></defs><rect width="960" height="600" fill="#fff"/><text x="64" y="70" class="tag">PRODUCTION READINESS</text><text x="64" y="112" class="title">一个循环距离生产系统，还差四项能力</text><path class="arrow" marker-end="url(#i1-arrow)" d="M480 290V230"/><path class="arrow" marker-end="url(#i1-arrow)" d="M365 330H286"/><path class="arrow" marker-end="url(#i1-arrow)" d="M595 330H674"/><path class="arrow" marker-end="url(#i1-arrow)" d="M480 370V430"/><rect x="365" y="290" width="230" height="80" rx="8" class="focal"/><text x="480" y="326" text-anchor="middle" class="name">Agent 基础循环</text><text x="480" y="350" text-anchor="middle" class="sub">模型调用 + 工具执行</text><rect x="350" y="150" width="260" height="80" rx="8" class="node"/><text x="480" y="184" text-anchor="middle" class="name">持久化</text><text x="480" y="208" text-anchor="middle" class="sub">中断后从检查点恢复</text><rect x="70" y="290" width="216" height="80" rx="8" class="node"/><text x="178" y="324" text-anchor="middle" class="name">人机协同</text><text x="178" y="348" text-anchor="middle" class="sub">暂停、审批、继续执行</text><rect x="674" y="290" width="216" height="80" rx="8" class="node"/><text x="782" y="324" text-anchor="middle" class="name">可观测性</text><text x="782" y="348" text-anchor="middle" class="sub">追踪调用、输入与结果</text><rect x="350" y="430" width="260" height="80" rx="8" class="node"/><text x="480" y="464" text-anchor="middle" class="name">沙盒隔离</text><text x="480" y="488" text-anchor="middle" class="sub">限制代码与文件访问范围</text><text x="64" y="558" class="sub">缺少其中任何一项，团队最终都要自己补上一层框架能力。</text></svg></div>
<div class="slide-label">小黑 01 · 放在「是否真的需要 Agent 框架」之后 · 文件:01-loop-vs-production.png</div><div class="slide xiaohei-row" data-xiaohei="01-loop-vs-production.png"><img src="xiaohei-illustrations/01-loop-vs-production.png" alt=""></div>
<div class="slide-label">配图 2 · 放在「Agent 技术栈的三层架构」之后</div>
<div class="slide" data-num="2"><svg viewBox="0 0 960 600" role="img" aria-labelledby="i2-title i2-desc"><title id="i2-title">Agent 技术栈的三层架构</title><desc id="i2-desc">编排框架、厂商运行时和通信协议分属不同层级。</desc><rect width="960" height="600" fill="#fff"/><text x="64" y="70" class="idx">THREE LAYERS</text><text x="64" y="112" class="title">这些工具不在同一层，也不必三选一</text><rect x="120" y="155" width="720" height="112" rx="8" class="node"/><text x="152" y="190" class="idx">L3</text><text x="206" y="193" class="name">编排框架</text><text x="206" y="220" class="sub">定义业务逻辑、状态与控制流</text><text x="808" y="206" text-anchor="end" class="item">LangGraph · CrewAI · Pydantic AI</text><rect x="120" y="283" width="720" height="112" rx="8" class="focal"/><text x="152" y="318" class="idx">L2</text><text x="206" y="321" class="name">厂商运行时</text><text x="206" y="348" class="sub">驱动模型、工具、上下文与会话</text><text x="808" y="334" text-anchor="end" class="item">OpenAI · Claude · Google ADK</text><rect x="120" y="411" width="720" height="112" rx="8" class="node"/><text x="152" y="446" class="idx">L1</text><text x="206" y="449" class="name">通信协议</text><text x="206" y="476" class="sub">连接工具与其他 Agent</text><text x="808" y="462" text-anchor="end" class="item">MCP · A2A</text><text x="120" y="562" class="sub">常见生产系统会同时使用一套框架、一个运行时和边界上的两种协议。</text></svg></div>
<div class="slide-label">配图 3 · 放在「迁移成本截然不同」之后</div>
<div class="slide" data-num="3"><svg viewBox="0 0 960 600" role="img" aria-labelledby="i3-title i3-desc"><title id="i3-title">三层工具的职责与迁移成本</title><desc id="i3-desc">运行时保存状态与会话，因此迁移成本最高。</desc><defs><marker id="i3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a7876"/></marker></defs><rect width="960" height="600" fill="#fff"/><text x="64" y="70" class="tag">RESPONSIBILITY &amp; LOCK-IN</text><text x="64" y="112" class="title">越靠近状态与会话，迁移成本越高</text><path class="arrow" marker-end="url(#i3-arrow)" d="M312 300H374"/><path class="arrow" marker-end="url(#i3-arrow)" d="M586 300H648"/><rect x="72" y="210" width="240" height="180" rx="8" class="node"/><text x="96" y="248" class="tag">FRAMEWORK</text><text x="96" y="282" class="name">表达逻辑</text><text x="96" y="314" class="sub">Prompt · 工具 · 控制流</text><text x="96" y="342" class="sub">业务逻辑大多可以复用</text><text x="96" y="372" class="cost">迁移成本：中</text><rect x="374" y="190" width="212" height="220" rx="8" class="focal"/><text x="398" y="228" class="tag">HARNESS</text><text x="398" y="262" class="name">执行与保存</text><text x="398" y="294" class="sub">状态 · 沙盒 · 会话历史</text><text x="398" y="322" class="sub">恢复与持久化能力</text><text x="398" y="366" class="cost">迁移成本：最高</text><rect x="648" y="210" width="240" height="180" rx="8" class="node"/><text x="672" y="248" class="tag">PROTOCOL</text><text x="672" y="282" class="name">定义通信格式</text><text x="672" y="314" class="sub">MCP · A2A</text><text x="672" y="342" class="sub">不负责运行 Agent</text><text x="672" y="372" class="cost">迁移成本：低</text><text x="72" y="472" class="sub">最难撤销的决定，不是 import 哪个库，而是把状态和运行环境交给了谁。</text></svg></div>
<div class="slide-label">小黑 02 · 放在「LangGraph vs CrewAI：该如何选择？」之后 · 文件:02-crew-vs-graph.png</div><div class="slide xiaohei-row" data-xiaohei="02-crew-vs-graph.png"><img src="xiaohei-illustrations/02-crew-vs-graph.png" alt=""></div>
<div class="slide-label">配图 4 · 放在「MCP vs A2A：你是否两者都需要？」之后</div>
<div class="slide" data-num="4"><svg viewBox="0 0 960 600" role="img" aria-labelledby="i4-title i4-desc"><title id="i4-title">MCP 与 A2A 的连接方向</title><desc id="i4-desc">MCP 连接 Agent 与工具和数据，A2A 连接跨边界的不同 Agent。</desc><defs><marker id="i4-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7a7876"/></marker><marker id="i4-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c4956a"/></marker></defs><rect width="960" height="600" fill="#fff"/><text x="64" y="70" class="tag">VERTICAL VS HORIZONTAL</text><text x="64" y="112" class="title">MCP 用东西，A2A 与其他 Agent 协作</text><path class="link" marker-end="url(#i4-gold)" d="M584 280H692"/><rect x="615" y="255" width="48" height="24" fill="#fff"/><text x="639" y="273" text-anchor="middle" class="label">A2A</text><path class="arrow" marker-end="url(#i4-arrow)" d="M480 340V425"/><rect x="456" y="372" width="48" height="24" fill="#fff"/><text x="480" y="390" text-anchor="middle" class="label">MCP</text><rect x="376" y="220" width="208" height="120" rx="8" class="focal"/><text x="480" y="270" text-anchor="middle" class="name">你的 Agent</text><text x="480" y="298" text-anchor="middle" class="sub">由你控制的运行边界</text><rect x="692" y="220" width="196" height="120" rx="8" class="node"/><text x="790" y="270" text-anchor="middle" class="name">外部 Agent</text><text x="790" y="298" text-anchor="middle" class="sub">跨团队 / 公司 / 框架</text><rect x="240" y="425" width="480" height="100" rx="8" class="node"/><text x="480" y="465" text-anchor="middle" class="name">工具与数据源</text><text x="480" y="493" text-anchor="middle" class="sub">数据库 · GitHub · Slack · 内部 API</text><text x="64" y="558" class="sub">同一代码库内的多 Agent 通常由框架负责交接，不必额外引入 A2A。</text></svg></div>
