<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头图 — 驯服 AI 审美 · DESIGN.md</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 20px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.92); padding: 14px 20px;
    display: flex; gap: 12px; justify-content: center; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .toolbar button {
    background: #C4956A; color: #1C1C1E; border: none;
    padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .toolbar button:hover { background: #d4a57a; }

  .cover {
    width: 900px; height: 383px; position: relative; overflow: hidden;
    border-radius: 8px;
  }
  .bg-dark {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 80% 30%, rgba(196,149,106,0.06), transparent 60%),
      radial-gradient(ellipse at 20% 85%, rgba(99,91,255,0.04), transparent 50%),
      #1C1C1E;
  }
  .hero-art {
    position: absolute; right: 48px; top: 50%; transform: translateY(-50%); z-index: 1;
  }
  .brand {
    position: absolute; top: 20px; left: 24px; z-index: 3;
    display: flex; align-items: center; gap: 8px;
  }
  .brand-text {
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
  }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 360px 0 70px; z-index: 2;
  }
  .kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #C4956A;
    text-transform: uppercase; padding-top: 12px; position: relative;
  }
  .kicker::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 32px; height: 1px; background: #C4956A;
  }
  .title {
    font-size: 58px; font-weight: 800; letter-spacing: -0.022em; line-height: 1.15;
    color: #F2EDE3; margin-top: 18px;
  }
  .title-sub {
    font-size: 28px; font-weight: 800; letter-spacing: -0.018em; line-height: 1.3;
    color: rgba(242,237,227,0.7); margin-top: 6px;
  }
  .lede {
    font-size: 16px; font-weight: 400; font-style: italic;
    color: rgba(255,255,255,0.45); margin-top: 18px; max-width: 420px; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="downloadCover('main')">下载头图 (900×383)</button>
    <button onclick="downloadCover('secondary')">下载次图 (200×200)</button>
  </div>

  <div class="cover" id="cover-main">
    <div class="bg-dark"></div>

    <!-- Hero Art: Design System Schematic -->
    <div class="hero-art">
      <svg width="300" height="280" viewBox="0 0 300 280" fill="none">
        <!-- Document outline -->
        <rect x="40" y="15" width="195" height="250" rx="10" stroke="rgba(242,237,227,0.12)" stroke-width="1.5" fill="rgba(242,237,227,0.03)"/>
        <!-- Dog-ear fold -->
        <path d="M195 15 L235 15 L235 55 Z" fill="rgba(242,237,227,0.06)" stroke="rgba(242,237,227,0.12)" stroke-width="1"/>
        <!-- Title bar -->
        <rect x="60" y="38" width="100" height="6" rx="3" fill="rgba(242,237,227,0.15)"/>
        <rect x="60" y="52" width="70" height="4" rx="2" fill="rgba(242,237,227,0.08)"/>
        <!-- Color swatch row -->
        <circle cx="75" cy="82" r="10" fill="#635bff" opacity="0.6"/>
        <circle cx="103" cy="82" r="10" fill="#00d4aa" opacity="0.5"/>
        <circle cx="131" cy="82" r="10" fill="#ff6b6b" opacity="0.5"/>
        <circle cx="159" cy="82" r="10" fill="#ffd43b" opacity="0.45"/>
        <circle cx="187" cy="82" r="10" fill="rgba(242,237,227,0.12)" stroke="rgba(242,237,227,0.2)" stroke-width="1" stroke-dasharray="3 2"/>
        <!-- Separator -->
        <line x1="60" y1="105" x2="215" y2="105" stroke="rgba(242,237,227,0.08)" stroke-width="1"/>
        <!-- Component blocks -->
        <rect x="60" y="118" width="70" height="32" rx="5" fill="rgba(196,149,106,0.15)" stroke="rgba(196,149,106,0.3)" stroke-width="1"/>
        <rect x="66" y="126" width="40" height="4" rx="2" fill="rgba(196,149,106,0.5)"/>
        <rect x="66" y="134" width="55" height="3" rx="1.5" fill="rgba(196,149,106,0.25)"/>
        <rect x="142" y="118" width="70" height="32" rx="5" fill="rgba(242,237,227,0.06)" stroke="rgba(242,237,227,0.12)" stroke-width="1"/>
        <rect x="148" y="126" width="40" height="4" rx="2" fill="rgba(242,237,227,0.15)"/>
        <rect x="148" y="134" width="55" height="3" rx="1.5" fill="rgba(242,237,227,0.08)"/>
        <!-- Grid lines -->
        <line x1="60" y1="168" x2="215" y2="168" stroke="rgba(242,237,227,0.06)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="60" y1="184" x2="180" y2="184" stroke="rgba(242,237,227,0.06)" stroke-width="1" stroke-dasharray="4 3"/>
        <line x1="60" y1="200" x2="200" y2="200" stroke="rgba(242,237,227,0.06)" stroke-width="1" stroke-dasharray="4 3"/>
        <!-- Spacing measurement -->
        <line x1="60" y1="218" x2="60" y2="240" stroke="#C4956A" stroke-width="0.8" opacity="0.4"/>
        <line x1="215" y1="218" x2="215" y2="240" stroke="#C4956A" stroke-width="0.8" opacity="0.4"/>
        <line x1="60" y1="229" x2="215" y2="229" stroke="#C4956A" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.35"/>
        <text x="138" y="226" font-size="8" fill="#C4956A" opacity="0.5" text-anchor="middle" font-family="SF Mono, monospace">8px grid</text>
        <!-- Constraint badge -->
        <circle cx="258" cy="55" r="22" fill="rgba(196,149,106,0.1)" stroke="rgba(196,149,106,0.4)" stroke-width="1.5"/>
        <polyline points="248,55 256,63 270,47" fill="none" stroke="#C4956A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Arrow from badge to doc -->
        <path d="M240 70 Q248 90 230 105" stroke="rgba(196,149,106,0.25)" stroke-width="1" fill="none" stroke-dasharray="3 3"/>
      </svg>
    </div>

    <!-- Brand badge -->
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
        <circle cx="13" cy="16" r="10" stroke="rgba(255,255,255,0.5)" stroke-width="2.2" fill="none"/>
        <ellipse cx="13" cy="8.5" rx="7" ry="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" fill="none"/>
        <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/>
        <polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/>
        <circle cx="16" cy="16.3" r="0.7" fill="#F2EDE3"/>
        <line x1="26" y1="4" x2="26" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
        <path d="M26 16 Q26 22 22 22" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <circle cx="26" cy="4" r="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
      </svg>
      <span class="brand-text">墨筝</span>
    </div>

    <!-- Content: left-aligned Medium style -->
    <div class="content">
      <div class="kicker">DESIGN SYSTEM</div>
      <div class="title">驯服 AI 审美</div>
      <div class="title-sub">DESIGN.md 拆解与实践指南</div>
      <div class="lede">用 Markdown 沉淀设计系统，让 Agent 在约束下输出一致的视觉</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
  <script>
  function flattenAlpha(canvas, bgColor) {
    const isTransparent = !bgColor || bgColor === 'transparent' || bgColor === 'rgba(0, 0, 0, 0)';
    const flat = document.createElement('canvas');
    flat.width = canvas.width; flat.height = canvas.height;
    const ctx = flat.getContext('2d');
    ctx.fillStyle = isTransparent ? '#1C1C1E' : bgColor;
    ctx.fillRect(0, 0, flat.width, flat.height);
    ctx.drawImage(canvas, 0, 0);
    return flat;
  }

  async function renderSlide(el) {
    const origRadius = el.style.borderRadius;
    el.style.borderRadius = '0';
    const bgEl = el.querySelector('.bg-light, .bg-dark');
    const bg = bgEl ? getComputedStyle(bgEl).backgroundColor : getComputedStyle(el).backgroundColor;
    const raw = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: null });
    el.style.borderRadius = origRadius;
    return flattenAlpha(raw, bg);
  }

  async function downloadCover(type) {
    const el = document.getElementById('cover-main');
    const canvas = await renderSlide(el);
    if (type === 'main') {
      canvas.toBlob(blob => saveAs(blob, 'design-md-头图.png'));
    } else {
      const sec = document.createElement('canvas');
      sec.width = 400; sec.height = 400;
      const ctx = sec.getContext('2d');
      const sx = (canvas.width - 400) / 2;
      const sy = (canvas.height - 400) / 2;
      ctx.drawImage(canvas, sx, sy, 400, 400, 0, 0, 400, 400);
      sec.toBlob(blob => saveAs(blob, 'design-md-次图.png'));
    }
  }
  </script>
</body>
</html>
