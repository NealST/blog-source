<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>头图 — 生成式 AI 未来会变得更贵吗？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0E0E10; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 20px 80px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.92); padding: 14px 20px;
    display: flex; gap: 12px; justify-content: center; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .toolbar button {
    background: #C4956A; color: #1C1C1E; border: none;
    padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .toolbar button:hover { background: #d4a57a; }

  .cover {
    width: 900px; height: 383px; position: relative; overflow: hidden;
    border-radius: 8px;
  }
  .bg-dark {
    position: absolute; inset: 0; background: #1C1C1E;
    background-image: radial-gradient(circle at 78% 42%, #2C2A28 0%, #1C1C1E 62%);
  }

  .hero-art {
    position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
    z-index: 1; opacity: 0.92;
  }

  .brand {
    position: absolute; top: 22px; left: 28px;
    display: flex; align-items: center; gap: 8px; z-index: 3;
  }
  .brand svg { width: 22px; height: 22px; }
  .brand-text {
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.45); letter-spacing: 1px;
  }

  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 400px 0 60px; z-index: 2;
  }

  .kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em;
    color: #C4956A; text-transform: uppercase;
    padding-top: 12px; position: relative;
    margin-bottom: 18px;
  }
  .kicker::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 32px; height: 1px; background: #C4956A;
  }

  .title {
    font-size: 38px; font-weight: 800; letter-spacing: -0.022em;
    line-height: 1.22; color: #F2EDE3;
  }
  .title .hook {
    color: #C4956A; font-weight: 900;
  }

  .lede {
    font-size: 15px; font-weight: 400; font-style: italic;
    color: rgba(255,255,255,0.55);
    margin-top: 18px; max-width: 430px; line-height: 1.55;
    letter-spacing: 0.2px;
  }

  .preview-secondary-hint {
    margin-top: 24px; font-size: 12px; color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="downloadCover('main')">下载头图 (900×383)</button>
  <button onclick="downloadCover('secondary')">下载次图 (200×200)</button>
</div>

<div class="cover" id="cover-main">
  <div class="bg-dark"></div>

  <div class="hero-art">
    <svg width="340" height="250" viewBox="0 0 340 250" fill="none">
      <!-- 坐标轴 -->
      <line x1="24" y1="14" x2="24" y2="210" stroke="#F2EDE3" stroke-width="0.7" opacity="0.18"/>
      <line x1="24" y1="210" x2="324" y2="210" stroke="#F2EDE3" stroke-width="0.7" opacity="0.18"/>
      <text x="20" y="8" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="end" font-family="SF Mono, Menlo, monospace" letter-spacing="0.5">成本</text>
      <text x="324" y="226" font-size="8" fill="rgba(255,255,255,0.35)" text-anchor="end" font-family="SF Mono, Menlo, monospace" letter-spacing="0.5">时间 →</text>

      <!-- 网格虚线 -->
      <line x1="24" y1="60" x2="324" y2="60" stroke="#F2EDE3" stroke-width="0.5" opacity="0.07" stroke-dasharray="2,4"/>
      <line x1="24" y1="110" x2="324" y2="110" stroke="#F2EDE3" stroke-width="0.5" opacity="0.07" stroke-dasharray="2,4"/>
      <line x1="24" y1="160" x2="324" y2="160" stroke="#F2EDE3" stroke-width="0.5" opacity="0.07" stroke-dasharray="2,4"/>

      <!-- 上升曲线：高级工作流（金色） -->
      <path d="M30 165 C 110 150, 150 120, 200 90 S 300 35, 320 24"
            stroke="#C4956A" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <circle cx="320" cy="24" r="4" fill="#C4956A"/>
      <text x="312" y="18" font-size="9" fill="#C4956A" text-anchor="end" font-weight="800" font-family="-apple-system, sans-serif">高级工作流 ↑</text>

      <!-- 下降曲线：基础模型（白色） -->
      <path d="M30 70 C 110 110, 160 150, 220 172 S 300 196, 320 200"
            stroke="rgba(242,237,227,0.7)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-dasharray="1,0"/>
      <circle cx="320" cy="200" r="3.5" fill="rgba(242,237,227,0.8)"/>
      <text x="312" y="194" font-size="9" fill="rgba(242,237,227,0.75)" text-anchor="end" font-weight="700" font-family="-apple-system, sans-serif">基础模型 ↓</text>

      <!-- 交叉点强调 -->
      <circle cx="170" cy="128" r="3" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <text x="170" y="244" font-size="8" fill="rgba(255,255,255,0.32)" text-anchor="middle" font-family="SF Mono, Menlo, monospace" letter-spacing="1">PRICE DIVERGENCE</text>
    </svg>
  </div>

  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="13" cy="16" r="10" stroke="rgba(255,255,255,0.5)" stroke-width="2.2" fill="none"/>
      <ellipse cx="13" cy="8.5" rx="7" ry="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" fill="none"/>
      <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/>
      <polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/>
      <circle cx="16" cy="16.3" r="0.7" fill="#F2EDE3"/>
      <line x1="26" y1="4" x2="26" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
      <path d="M26 16 Q26 22 22 22" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="26" cy="4" r="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="brand-text">墨筝</span>
  </div>

  <div class="content">
    <div class="kicker">AI · 成本观察</div>
    <h1 class="title">生成式 AI<br/>未来会<span class="hook">更贵</span>吗？</h1>
    <p class="lede">基础模型一路降价，高级工作流持续涨价——一场正在分叉的成本竞赛。</p>
  </div>
</div>

<div class="preview-secondary-hint">↑ 主图（900×383）｜次图自动从左下裁切 kicker + 标题区域</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
function flattenAlpha(canvas, bgColor) {
  const isTransparent = !bgColor || bgColor === 'transparent' || bgColor === 'rgba(0, 0, 0, 0)';
  const flat = document.createElement('canvas');
  flat.width = canvas.width; flat.height = canvas.height;
  const ctx = flat.getContext('2d');
  ctx.fillStyle = isTransparent ? '#1C1C1E' : bgColor;
  ctx.fillRect(0, 0, flat.width, flat.height);
  ctx.drawImage(canvas, 0, 0);
  return flat;
}

async function renderSlide(el) {
  const origRadius = el.style.borderRadius;
  el.style.borderRadius = '0';
  const bgEl = el.querySelector('.bg-light, .bg-dark');
  const bg = bgEl ? getComputedStyle(bgEl).backgroundColor : getComputedStyle(el).backgroundColor;
  const raw = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: null });
  el.style.borderRadius = origRadius;
  return flattenAlpha(raw, bg);
}

async function downloadCover(type) {
  const el = document.getElementById('cover-main');
  const canvas = await renderSlide(el);
  if (type === 'main') {
    canvas.toBlob(blob => saveAs(blob, 'ai-cost-头图.png'), 'image/png');
  } else {
    const SRC_X = 100;
    const SRC_Y = 130;
    const SRC_SIZE = 500;
    const crop = document.createElement('canvas');
    crop.width = 400; crop.height = 400;
    const ctx = crop.getContext('2d');
    ctx.drawImage(canvas, SRC_X, SRC_Y, SRC_SIZE, SRC_SIZE, 0, 0, 400, 400);
    crop.toBlob(blob => saveAs(blob, 'ai-cost-次图.png'), 'image/png');
  }
}
</script>
</body>
</html>
