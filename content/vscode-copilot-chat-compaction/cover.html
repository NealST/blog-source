<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面 - VS Code Copilot 上下文压缩</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 80px; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.toolbar { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); padding: 12px 24px; display: flex; gap: 12px; z-index: 999; }
.toolbar button { padding: 8px 16px; border: none; border-radius: 6px; background: #C4956A; color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; }
.toolbar button:hover { background: #b8845a; }
.cover { width: 900px; height: 383px; position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 40px; }
.bg-dark { position: absolute; inset: 0; background: #1C1C1E; }
.bg-lines { position: absolute; inset: 0; opacity: 0.95; }
.content { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-columns: 1fr 392px; }
.copy { padding: 82px 24px 58px 58px; display: flex; flex-direction: column; justify-content: center; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; color: #C4956A; text-transform: uppercase; padding-top: 10px; position: relative; }
.kicker::before { content: ''; position: absolute; top: 0; left: 0; width: 32px; height: 1px; background: #C4956A; }
.title { font-size: 40px; font-weight: 800; letter-spacing: 0; line-height: 1.22; color: #F2EDE3; margin-top: 16px; max-width: 470px; }
.title .accent { color: #C4956A; }
.lede { font-size: 15px; line-height: 1.58; color: rgba(255,255,255,0.56); margin-top: 17px; max-width: 440px; }
.tags { position: absolute; left: 58px; bottom: 28px; display: flex; gap: 14px; font-size: 11px; color: rgba(255,255,255,0.34); letter-spacing: 0.1em; text-transform: uppercase; }
.brand { position: absolute; top: 22px; left: 26px; display: flex; align-items: center; gap: 8px; z-index: 3; }
.brand svg { width: 22px; height: 22px; }
.brand-text { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 1px; }
.diagram { position: relative; display: flex; align-items: center; justify-content: center; padding: 42px 34px 34px 4px; }
.diagram svg { width: 360px; height: 292px; display: block; }
.node-label { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.6px; }
.node-sub { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 8px; }
</style>
</head>
<body>

  <button onclick="downloadCover('secondary')">下载次图 (200x200)</button>

    <path d="M486 318 C590 275 690 300 858 248" stroke="url(#goldFade)" stroke-width="1" fill="none"/>

      <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/>
      <polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/>

        <path d="M112 231 C146 231 149 162 174 162" stroke="#C4956A" stroke-width="2.2" fill="none"/>

        <text x="211" y="108" text-anchor="middle" fill="#F2EDE3" class="node-label">Prompt</text>
        <text x="211" y="124" text-anchor="middle" fill="#C4956A" class="node-label">TSX</text>

        <text x="211" y="158" text-anchor="middle" fill="rgba(255,255,255,0.45)" class="node-sub">budget aware</text>

        <path d="M248 127 C270 127 273 151 294 151" stroke="#C4956A" stroke-width="2" fill="none"/>
        <path d="M248 127 C270 127 273 206 294 206" stroke="rgba(143,188,187,0.62)" stroke-width="1.7" fill="none"/>

        <rect x="294" y="74" width="54" height="44" rx="7" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.18)"/>
        <text x="321" y="94" text-anchor="middle" fill="rgba(255,255,255,0.42)" class="node-label">Cut</text>
        <text x="321" y="108" text-anchor="middle" fill="rgba(255,255,255,0.32)" class="node-sub">local</text>

        <text x="321" y="148" text-anchor="middle" fill="#C4956A" class="node-label">Summary</text>

  <div class="tags">
    <span>PROMPT TSX</span>
    <span>BACKGROUND SUMMARY</span>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
function flattenAlpha(canvas, bgColor) {
  const isTransparent = !bgColor || bgColor === 'transparent' || bgColor === 'rgba(0, 0, 0, 0)';
  const flat = document.createElement('canvas');
  flat.width = canvas.width; flat.height = canvas.height;
  const ctx = flat.getContext('2d');
  ctx.fillStyle = isTransparent ? '#1C1C1E' : bgColor;
  ctx.fillRect(0, 0, flat.width, flat.height);
  ctx.drawImage(canvas, 0, 0);
  return flat;
}

async function renderSlide(el) {
  const origRadius = el.style.borderRadius;
  el.style.borderRadius = '0';
  const bgEl = el.querySelector('.bg-light, .bg-dark');
  const bg = bgEl ? getComputedStyle(bgEl).backgroundColor : getComputedStyle(el).backgroundColor;
  const raw = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: null });
  el.style.borderRadius = origRadius;
  return flattenAlpha(raw, bg);
}

async function downloadCover(type) {
  const el = document.getElementById('cover-main');
  const canvas = await renderSlide(el);

  if (type === 'main') {
    canvas.toBlob(blob => saveAs(blob, 'vscode-copilot-chat-compaction-cover-900x383.png'), 'image/png');
  } else {
    const crop = document.createElement('canvas');
    crop.width = 400; crop.height = 400;
    const ctx = crop.getContext('2d');
    const sx = Math.round((canvas.width - 400) / 2);
    const sy = Math.round((canvas.height - 400) / 2);
    ctx.drawImage(canvas, sx, sy, 400, 400, 0, 0, 400, 400);
    crop.toBlob(blob => saveAs(blob, 'vscode-copilot-chat-compaction-cover-200x200.png'), 'image/png');
  }
}
</script>
</body>
</html>
