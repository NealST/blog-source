<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <defs>
    <marker id="arrowGold" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M 0 1 L 8 4 L 0 7" fill="none" stroke="#A07848" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 圆形怪机器主体 -->
  <circle cx="800" cy="470" r="175" fill="none" stroke="#1a1a1a" stroke-width="2.8"/>
  <!-- 内圈齿轮感装饰 -->
  <circle cx="800" cy="470" r="150" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.15" stroke-dasharray="8 12"/>

  <!-- 上方管道：上下文 -->
  <rect x="775" y="260" width="50" height="40" rx="5" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <!-- 管道接口铆钉 -->
  <circle cx="783" cy="268" r="2" fill="#1a1a1a" opacity="0.3"/>
  <circle cx="817" cy="268" r="2" fill="#1a1a1a" opacity="0.3"/>
  <!-- 管道栅栏线 -->
  <line x1="788" y1="270" x2="788" y2="295" stroke="#1a1a1a" stroke-width="0.8" opacity="0.3"/>
  <line x1="800" y1="270" x2="800" y2="295" stroke="#1a1a1a" stroke-width="0.8" opacity="0.3"/>
  <line x1="812" y1="270" x2="812" y2="295" stroke="#1a1a1a" stroke-width="0.8" opacity="0.3"/>

  <!-- 右方管道：工具 -->
  <rect x="990" y="448" width="40" height="50" rx="5" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <circle cx="998" cy="456" r="2" fill="#1a1a1a" opacity="0.3"/>
  <circle cx="998" cy="490" r="2" fill="#1a1a1a" opacity="0.3"/>

  <!-- 下方管道：执行 -->
  <rect x="775" y="680" width="50" height="40" rx="5" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <!-- 输出箭头 -->
  <path d="M 790 695 L 800 710 L 810 695" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 左方管道：验证 -->
  <rect x="570" y="448" width="40" height="50" rx="5" fill="none" stroke="#1a1a1a" stroke-width="2.2"/>
  <!-- 勾号 -->
  <path d="M 582 468 L 590 480 L 602 462" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 筝弦金箭头闭环（四段弧线） -->
  <path d="M 830 300 Q 940 330 980 448" stroke="#A07848" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>
  <path d="M 980 498 Q 940 615 830 680" stroke="#A07848" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>
  <path d="M 770 680 Q 660 615 615 498" stroke="#A07848" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>
  <path d="M 615 448 Q 660 335 770 300" stroke="#A07848" stroke-width="2.5" fill="none" marker-end="url(#arrowGold)"/>

  <!-- 中央旋钮 -->
  <circle cx="800" cy="470" r="28" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="800" cy="470" r="8" fill="#1a1a1a"/>
  <!-- 旋钮指针 -->
  <line x1="800" y1="470" x2="800" y2="446" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  <!-- 旋钮刻度 -->
  <line x1="776" y1="470" x2="780" y2="470" stroke="#1a1a1a" stroke-width="1.5" opacity="0.4"/>
  <line x1="824" y1="470" x2="820" y2="470" stroke="#1a1a1a" stroke-width="1.5" opacity="0.4"/>

  <!-- 小黑站在机器顶部 -->
  <!-- 身体 -->
  <path d="M 800 395 Q 775 400 772 420 Q 770 435 785 440 Q 800 444 815 440 Q 830 435 828 420 Q 826 400 800 395 Z"
        fill="#1a1a1a"/>
  <!-- 头 -->
  <circle cx="800" cy="372" r="19" fill="#1a1a1a"/>
  <!-- 左耳 -->
  <path d="M 786 358 L 783 340 L 794 356" fill="#1a1a1a"/>
  <!-- 右耳 -->
  <path d="M 814 358 L 817 340 L 806 356" fill="#1a1a1a"/>
  <!-- 眼睛 -->
  <circle cx="794" cy="372" r="3" fill="#ffffff"/>
  <circle cx="806" cy="372" r="3" fill="#ffffff"/>
  <!-- 手臂伸向旋钮 -->
  <path d="M 780 430 Q 775 445 785 458" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 820 430 Q 825 445 815 458" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 腿站在机器圆弧上 -->
  <line x1="790" y1="440" x2="786" y2="455" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="810" y1="440" x2="814" y2="455" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 运转抖动线 -->
  <path d="M 730 660 Q 735 653 740 660 Q 745 667 750 660" stroke="#1a1a1a" stroke-width="1.2" fill="none" opacity="0.3"/>
  <path d="M 845 660 Q 850 653 855 660 Q 860 667 865 660" stroke="#1a1a1a" stroke-width="1.2" fill="none" opacity="0.3"/>
  <path d="M 960 530 Q 965 525 968 530 Q 971 535 975 530" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.2"/>

  <!-- 管道标注 -->
  <text x="800" y="240" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="20" fill="#4a7ab5">上下文</text>
  <text x="800" y="258" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="13" fill="#4a7ab5" opacity="0.6">什么重要</text>

  <text x="1080" y="478" font-family="'PingFang SC', 'STKaiti', serif" font-size="20" fill="#4a7ab5">工具</text>
  <text x="1080" y="496" font-family="'PingFang SC', 'STKaiti', serif" font-size="13" fill="#4a7ab5" opacity="0.6">能碰什么</text>

  <text x="800" y="752" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="20" fill="#4a7ab5">执行</text>
  <text x="800" y="770" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="13" fill="#4a7ab5" opacity="0.6">生成代码</text>

  <text x="515" y="478" text-anchor="end" font-family="'PingFang SC', 'STKaiti', serif" font-size="20" fill="#4a7ab5">验证</text>
  <text x="515" y="496" text-anchor="end" font-family="'PingFang SC', 'STKaiti', serif" font-size="13" fill="#4a7ab5" opacity="0.6">做对没有</text>

  <!-- 右上角强调 -->
  <text x="1200" y="300" font-family="'PingFang SC', 'STKaiti', serif" font-size="24" fill="#A07848" font-weight="600">闭环</text>
  <path d="M 1195 306 Q 1220 310 1255 306" stroke="#A07848" stroke-width="1.2" fill="none" stroke-linecap="round"/>
</svg>
