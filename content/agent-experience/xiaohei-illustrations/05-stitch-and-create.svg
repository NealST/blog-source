<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ======== 分隔线（上下两层世界） ======== -->
  <line x1="300" y1="470" x2="1300" y2="470" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="8 8" opacity="0.15"/>

  <!-- ======== 上半部分：人手自由画蓝图 ======== -->

  <!-- 人手和前臂（简笔画，从左侧伸入） -->
  <path d="M 480 180 Q 530 185 560 200 Q 580 210 590 230 Q 595 245 588 255 Q 580 262 572 255 Q 568 248 572 238 L 580 220"
        stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 袖口 -->
  <path d="M 478 175 Q 480 170 485 175 Q 490 180 485 185" stroke="#1a1a1a" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- 手指握笔 -->
  <path d="M 572 238 L 582 255 L 595 280" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 笔 -->
  <line x1="595" y1="280" x2="630" y2="340" stroke="#4a7ab5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="632" cy="344" r="2.5" fill="#4a7ab5"/>

  <!-- 蓝图草图（潇洒自由的线条） -->
  <!-- 建筑轮廓 -->
  <path d="M 700 250 L 700 340 L 780 340 L 780 280 L 830 280 L 830 340 L 900 340 L 900 230 L 850 200 L 800 230 L 750 200 L 700 250"
        stroke="#4a7ab5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <!-- 窗户 -->
  <rect x="720" y="295" width="20" height="20" rx="2" fill="none" stroke="#4a7ab5" stroke-width="1.2" opacity="0.4"/>
  <rect x="855" y="295" width="20" height="20" rx="2" fill="none" stroke="#4a7ab5" stroke-width="1.2" opacity="0.4"/>
  <!-- 自由曲线（设计灵感） -->
  <path d="M 950 260 Q 1000 240 1050 270 Q 1100 300 1130 260"
        stroke="#4a7ab5" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.45"/>
  <!-- 小星星/灵感标记 -->
  <path d="M 1000 220 L 1003 228 L 1012 228 L 1005 234 L 1008 242 L 1000 237 L 992 242 L 995 234 L 988 228 L 997 228 Z"
        fill="none" stroke="#4a7ab5" stroke-width="1" opacity="0.35"/>
  <!-- 圆弧草图 -->
  <circle cx="1100" cy="300" r="22" fill="none" stroke="#4a7ab5" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4"/>

  <!-- ======== 下半部分：小黑缝合碎片 ======== -->

  <!-- 碎片模块（散落在地） -->
  <!-- 碎片1: API -->
  <g transform="rotate(-5 430 610)">
    <rect x="400" y="590" width="65" height="45" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="432" y="618" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#1a1a1a" opacity="0.45">API</text>
  </g>
  <!-- 碎片2: Design -->
  <g transform="rotate(3 610 605)">
    <rect x="575" y="585" width="70" height="45" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="610" y="613" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1a1a1a" opacity="0.45">Design</text>
  </g>
  <!-- 碎片3: Ops -->
  <g transform="rotate(-2 850 600)">
    <rect x="818" y="582" width="65" height="42" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="850" y="608" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#1a1a1a" opacity="0.45">Ops</text>
  </g>
  <!-- 碎片4: Test -->
  <g transform="rotate(6 1040 608)">
    <rect x="1008" y="588" width="65" height="42" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="1040" y="614" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#1a1a1a" opacity="0.45">Test</text>
  </g>
  <!-- 碎片5: CI/CD -->
  <g transform="rotate(-4 1190 600)">
    <rect x="1155" y="580" width="70" height="42" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <text x="1190" y="606" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#1a1a1a" opacity="0.45">CI/CD</text>
  </g>

  <!-- 筝弦金缝合线（穿过所有碎片） -->
  <path d="M 465 610 Q 510 598 575 607 Q 640 618 650 608 Q 665 595 818 602 Q 870 608 883 600 Q 900 590 1008 605 Q 1060 612 1073 605 Q 1090 595 1155 600"
        stroke="#A07848" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- 缝合针脚 X 形 -->
  <g opacity="0.7">
    <!-- 缝1 -->
    <line x1="530" y1="598" x2="536" y2="618" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="536" y1="598" x2="530" y2="618" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 缝2 -->
    <line x1="735" y1="596" x2="741" y2="616" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="741" y1="596" x2="735" y2="616" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 缝3 -->
    <line x1="945" y1="594" x2="951" y2="614" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="951" y1="594" x2="945" y2="614" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
    <!-- 缝4 -->
    <line x1="1115" y1="596" x2="1121" y2="616" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="1121" y1="596" x2="1115" y2="616" stroke="#A07848" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ======== 小黑趴着缝合 ======== -->
  <!-- 身体（趴伏姿态） -->
  <path d="M 720 650 Q 700 648 695 660 Q 692 672 708 678 Q 725 682 742 678 Q 758 672 755 660 Q 752 648 735 650 Z"
        fill="#1a1a1a"/>
  <!-- 头（朝右看着缝合点） -->
  <circle cx="762" cy="645" r="16" fill="#1a1a1a"/>
  <!-- 耳朵 -->
  <path d="M 752 633 L 750 618 L 760 632" fill="#1a1a1a"/>
  <path d="M 772 632 L 776 617 L 766 631" fill="#1a1a1a"/>
  <!-- 眼睛 -->
  <circle cx="766" cy="644" r="2.5" fill="#ffffff"/>
  <circle cx="758" cy="645" r="2.5" fill="#ffffff"/>
  <!-- 手臂伸出持针 -->
  <path d="M 755 665 L 778 652 L 800 640" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 针 -->
  <line x1="800" y1="640" x2="825" y2="625" stroke="#A07848" stroke-width="2" stroke-linecap="round"/>
  <circle cx="826" cy="624" r="2" fill="#A07848"/>
  <!-- 针尾线头 -->
  <path d="M 826 624 Q 835 618 840 610" stroke="#A07848" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 尾巴 -->
  <path d="M 695 660 Q 678 655 672 645 Q 668 638 674 635"
        stroke="#1a1a1a" stroke-width="4.5" fill="none" stroke-linecap="round"/>

  <!-- ======== 手写标注 ======== -->
  <!-- 上方 -->
  <text x="450" y="250" font-family="'PingFang SC', 'STKaiti', serif" font-size="22" fill="#4a7ab5">创造</text>
  <path d="M 445 256 Q 465 260 500 256" stroke="#4a7ab5" stroke-width="1" fill="none" stroke-linecap="round"/>
  <text x="450" y="278" font-family="'PingFang SC', 'STKaiti', serif" font-size="14" fill="#4a7ab5" opacity="0.6">判断 · 品味 · 架构 · 策略</text>

  <!-- 下方 -->
  <text x="450" y="660" font-family="'PingFang SC', 'STKaiti', serif" font-size="22" fill="#A07848">缝合</text>
  <path d="M 445 666 Q 465 670 500 666" stroke="#A07848" stroke-width="1" fill="none" stroke-linecap="round"/>
  <text x="450" y="688" font-family="'PingFang SC', 'STKaiti', serif" font-size="14" fill="#1a1a1a" opacity="0.4">胶水层 · 协调 · 中转</text>

  <!-- 右侧分层标记 -->
  <text x="1300" y="350" font-family="'PingFang SC', 'STKaiti', serif" font-size="16" fill="#1a1a1a" opacity="0.3">↑ 人类</text>
  <text x="1300" y="580" font-family="'PingFang SC', 'STKaiti', serif" font-size="16" fill="#1a1a1a" opacity="0.3">↓ Agent</text>
  <!-- 连接虚线 -->
  <line x1="1318" y1="360" x2="1318" y2="560" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.15"/>
</svg>
