<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- 天平底座 -->
  <path d="M 720 720 Q 800 730 880 720" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 天平立柱 -->
  <path d="M 800 720 L 800 380" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 支点三角装饰 -->
  <path d="M 785 380 L 800 360 L 815 380" fill="none" stroke="#A07848" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 横杆（左高右低，明显倾斜） -->
  <line x1="440" y1="390" x2="1160" y2="490" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- === 左盘（高/轻）：写代码 === -->
  <!-- 悬线 -->
  <line x1="440" y1="390" x2="390" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="390" x2="490" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- 盘 -->
  <path d="M 370 420 Q 440 435 510 420" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 一张轻飘飘的代码纸 -->
  <g transform="rotate(-8 440 395)">
    <rect x="420" y="380" width="42" height="32" rx="3" fill="none" stroke="#4a7ab5" stroke-width="1.5"/>
    <text x="430" y="397" font-family="'Courier New', monospace" font-size="9" fill="#4a7ab5">fn()</text>
    <text x="430" y="407" font-family="'Courier New', monospace" font-size="8" fill="#4a7ab5" opacity="0.5">  {}</text>
  </g>
  <!-- 飘起来的弧线 -->
  <path d="M 415 372 Q 420 365 428 370" stroke="#1a1a1a" stroke-width="0.8" fill="none" opacity="0.25"/>
  <path d="M 460 368 Q 465 362 472 366" stroke="#1a1a1a" stroke-width="0.8" fill="none" opacity="0.25"/>
  <path d="M 445 360 Q 448 354 454 358" stroke="#1a1a1a" stroke-width="0.8" fill="none" opacity="0.2"/>

  <!-- === 右盘（低/重）：审查 === -->
  <!-- 悬线 -->
  <line x1="1160" y1="490" x2="1110" y2="520" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="1160" y1="490" x2="1210" y2="520" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- 盘 -->
  <path d="M 1090 520 Q 1160 535 1230 520" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- 重物堆：放大镜 -->
  <circle cx="1120" cy="492" r="16" fill="none" stroke="#cc3333" stroke-width="2.2"/>
  <line x1="1132" y1="504" x2="1145" y2="518" stroke="#cc3333" stroke-width="3" stroke-linecap="round"/>
  <!-- 红笔 -->
  <line x1="1155" y1="475" x2="1180" y2="512" stroke="#cc3333" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="1155" cy="475" r="3.5" fill="#cc3333"/>
  <!-- 文件堆 -->
  <rect x="1130" y="468" width="35" height="5" rx="1.5" fill="#1a1a1a" opacity="0.25"/>
  <rect x="1128" y="462" width="35" height="5" rx="1.5" fill="#1a1a1a" opacity="0.35"/>
  <rect x="1132" y="456" width="35" height="5" rx="1.5" fill="#1a1a1a" opacity="0.45"/>
  <rect x="1126" y="450" width="35" height="5" rx="1.5" fill="#1a1a1a" opacity="0.3"/>
  <!-- 问号 -->
  <text x="1195" y="495" font-size="22" font-weight="800" fill="#cc3333" opacity="0.6">?</text>
  <text x="1205" y="480" font-size="16" font-weight="800" fill="#cc3333" opacity="0.4">?</text>

  <!-- === 小黑站在支点上方试图扶横杆 === -->
  <!-- 身体 -->
  <path d="M 800 330 Q 780 333 777 348 Q 775 360 790 366 Q 800 370 810 366 Q 825 360 823 348 Q 821 333 802 330 Z"
        fill="#1a1a1a"/>
  <!-- 头 -->
  <circle cx="800" cy="310" r="17" fill="#1a1a1a"/>
  <!-- 耳朵 -->
  <path d="M 789 298 L 786 282 L 796 296" fill="#1a1a1a"/>
  <path d="M 811 298 L 814 282 L 804 296" fill="#1a1a1a"/>
  <!-- 眼睛 -->
  <circle cx="795" cy="310" r="2.8" fill="#ffffff"/>
  <circle cx="805" cy="310" r="2.8" fill="#ffffff"/>
  <!-- 手臂伸展扶横杆（挣扎感） -->
  <path d="M 780 350 Q 750 365 720 380" stroke="#1a1a1a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M 820 350 Q 850 370 880 395" stroke="#1a1a1a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- 腿 -->
  <line x1="792" y1="366" x2="789" y2="380" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="808" y1="366" x2="811" y2="380" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 小尾巴 -->
  <path d="M 823 355 Q 835 348 838 338" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- 挣扎抖动线 -->
  <path d="M 760 340 Q 758 335 755 340" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 840 345 Q 842 340 845 345" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- 手写标注 -->
  <text x="440" y="340" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="22" fill="#4a7ab5">写 ≈ 0</text>
  <path d="M 410 346 Q 440 350 475 346" stroke="#4a7ab5" stroke-width="1" fill="none" stroke-linecap="round"/>

  <text x="1160" y="410" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="22" fill="#cc3333">审查 ↑↑↑</text>

  <!-- 倾斜方向箭头 -->
  <path d="M 1250 530 L 1235 555" stroke="#cc3333" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 1230 558 L 1240 550 L 1237 562" fill="#cc3333"/>
  <text x="1255" y="545" font-family="'PingFang SC', 'STKaiti', serif" font-size="17" fill="#cc3333">失衡</text>

  <!-- 底部总结 -->
  <text x="800" y="790" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="20" fill="#A07848">认知负荷没有消失，只是转移了</text>
  <path d="M 670 796 Q 800 802 930 796" stroke="#A07848" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
