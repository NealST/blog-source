<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <defs>
    <marker id="arrowR" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M 0 0.5 L 6 3 L 0 5.5" fill="none" stroke="#cc3333" stroke-width="1.2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- 地面线 -->
  <path d="M 150 620 Q 300 618 500 620 L 720 620" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 880 620 Q 1000 618 1200 620 L 1450 620" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- 中间裂缝（锯齿形） -->
  <path d="M 740 580 L 750 598 L 735 610 L 755 620 L 740 638 L 758 660 L 745 690"
        stroke="#cc3333" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 860 580 L 850 598 L 865 610 L 845 620 L 860 638 L 842 660 L 855 690"
        stroke="#cc3333" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 裂缝碎片 -->
  <path d="M 770 610 L 780 615 L 775 625" stroke="#cc3333" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M 830 605 L 822 612 L 828 620" stroke="#cc3333" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- ========= 左边：小黑蹲着修路 ========= -->
  <!-- 小黑（侧面朝右） -->
  <path d="M 500 555 Q 480 558 475 575 Q 472 590 488 598 Q 505 604 520 598 Q 535 590 532 575 Q 530 558 510 555 Z"
        fill="#1a1a1a"/>
  <!-- 头 -->
  <circle cx="530" cy="540" r="20" fill="#1a1a1a"/>
  <!-- 耳朵 -->
  <path d="M 518 526 L 516 508 L 528 524" fill="#1a1a1a"/>
  <path d="M 540 524 L 544 506 L 534 522" fill="#1a1a1a"/>
  <!-- 眼睛 -->
  <circle cx="534" cy="538" r="3" fill="#ffffff"/>
  <circle cx="526" cy="540" r="3" fill="#ffffff"/>
  <!-- 手臂举扳手 -->
  <path d="M 535 570 L 560 548 L 575 540" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 扳手 -->
  <path d="M 575 540 L 600 518" stroke="#A07848" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M 596 510 L 608 522" stroke="#A07848" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="602" cy="516" r="4" fill="none" stroke="#A07848" stroke-width="1.5"/>
  <!-- 前腿 -->
  <line x1="495" y1="598" x2="490" y2="618" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="515" y1="598" x2="520" y2="618" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 尾巴 -->
  <path d="M 475 575 Q 458 568 452 555" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 工具箱 -->
  <rect x="380" y="598" width="55" height="28" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 396 598 L 396 592 Q 396 588 400 588 L 418 588 Q 422 588 422 592 L 422 598"
        stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

  <!-- 左边：修好的稳实路段 -->
  <path d="M 150 620 L 720 620" stroke="#A07848" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 路面小修补痕迹 -->
  <path d="M 620 615 L 635 618" stroke="#A07848" stroke-width="1" opacity="0.4"/>
  <path d="M 650 622 L 665 618" stroke="#A07848" stroke-width="1" opacity="0.4"/>

  <!-- ========= 右边：小黑跳过裂缝铺歪路 ========= -->
  <!-- 小黑（空中飞跃，向右奔跑姿态） -->
  <path d="M 1070 500 Q 1050 504 1048 518 Q 1046 530 1060 536 Q 1075 540 1088 536 Q 1100 530 1098 518 Q 1096 504 1078 500 Z"
        fill="#1a1a1a"/>
  <!-- 头 -->
  <circle cx="1100" cy="490" r="18" fill="#1a1a1a"/>
  <!-- 耳朵 -->
  <path d="M 1090 476 L 1088 460 L 1098 475" fill="#1a1a1a"/>
  <path d="M 1110 475 L 1114 459 L 1104 474" fill="#1a1a1a"/>
  <!-- 眼睛 -->
  <circle cx="1104" cy="489" r="2.8" fill="#ffffff"/>
  <circle cx="1096" cy="490" r="2.8" fill="#ffffff"/>
  <!-- 前腿（奔跑伸展） -->
  <path d="M 1085 536 L 1078 555 L 1072 565" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 1068 536 L 1060 555 L 1055 562" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 尾巴（飘动） -->
  <path d="M 1048 510 Q 1030 505 1022 495 Q 1018 488 1025 485"
        stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 歪斜路（虚线，摇摆不稳） -->
  <path d="M 880 620 Q 920 608 960 630 Q 1000 650 1040 612 Q 1080 580 1120 640 Q 1150 670 1200 600 Q 1240 545 1300 615"
        stroke="#cc3333" stroke-width="2.5" fill="none" stroke-dasharray="10 5" stroke-linecap="round"/>

  <!-- commit 小旗 -->
  <line x1="1320" y1="560" x2="1320" y2="618" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1320 560 L 1368 573 L 1320 586" fill="#cc3333" opacity="0.85"/>
  <text x="1335" y="577" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" font-weight="700">commit</text>

  <!-- 手写标注 -->
  <text x="500" y="480" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="19" fill="#A07848">停下排查</text>
  <path d="M 465 485 Q 500 490 545 485" stroke="#A07848" stroke-width="1" fill="none" stroke-linecap="round"/>

  <text x="1080" y="450" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="19" fill="#cc3333">绕过</text>

  <text x="800" y="555" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="18" fill="#cc3333">报错!</text>
  <!-- 箭头指向裂缝 -->
  <path d="M 800 560 L 800 578" stroke="#cc3333" stroke-width="1.2" fill="none" marker-end="url(#arrowR)"/>

  <text x="1320" y="545" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="15" fill="#cc3333">提交猜测</text>

  <!-- 底部补充 -->
  <text x="800" y="770" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="16" fill="#4a7ab5">环境本身就是 prompt 的一部分</text>
  <path d="M 680 775 Q 800 780 920 775" stroke="#4a7ab5" stroke-width="0.8" fill="none" stroke-linecap="round"/>
</svg>
