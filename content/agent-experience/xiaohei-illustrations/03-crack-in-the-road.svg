<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- 地面 -->
  <line x1="200" y1="620" x2="1400" y2="620" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- 中间裂缝 -->
  <path d="M 780 580 L 785 595 L 775 610 L 790 620 L 780 640 L 795 660 L 785 680"
        stroke="#cc3333" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 810 580 L 815 595 L 820 610 L 808 620 L 818 640 L 810 660 L 820 680"
        stroke="#cc3333" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 左边：小黑蹲着修 -->
  <!-- 身体 -->
  <ellipse cx="580" cy="580" rx="26" ry="22" fill="#1a1a1a"/>
  <!-- 头 -->
  <circle cx="580" cy="552" r="18" fill="#1a1a1a"/>
  <!-- 耳朵 -->
  <polygon points="567,540 570,526 576,540" fill="#1a1a1a"/>
  <polygon points="593,540 590,526 584,540" fill="#1a1a1a"/>
  <!-- 眼睛 -->
  <circle cx="575" cy="551" r="2.5" fill="#ffffff"/>
  <circle cx="585" cy="551" r="2.5" fill="#ffffff"/>
  <!-- 手臂举扳手 -->
  <path d="M 600 570 L 630 545 L 640 548" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 扳手 -->
  <path d="M 635 540 L 660 520 M 655 515 L 665 525" stroke="#A07848" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 腿 -->
  <line x1="570" y1="598" x2="565" y2="618" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="590" y1="598" x2="595" y2="618" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 工具箱 -->
  <rect x="470" y="595" width="50" height="30" rx="3" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="485" y1="595" x2="505" y2="595" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- 左边的稳实路面（筝弦金色修复） -->
  <path d="M 200 620 L 750 620" stroke="#A07848" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 右边：小黑跳过裂缝铺歪路 -->
  <!-- 小黑在空中 -->
  <ellipse cx="1050" cy="520" rx="24" ry="20" fill="#1a1a1a"/>
  <circle cx="1050" cy="494" r="16" fill="#1a1a1a"/>
  <polygon points="1039,483 1041,470 1047,483" fill="#1a1a1a"/>
  <polygon points="1061,483 1059,470 1053,483" fill="#1a1a1a"/>
  <circle cx="1045" cy="493" r="2.5" fill="#ffffff"/>
  <circle cx="1055" cy="493" r="2.5" fill="#ffffff"/>
  <!-- 腿 悬空 -->
  <line x1="1040" y1="538" x2="1035" y2="555" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="1060" y1="538" x2="1065" y2="555" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 歪斜路 -->
  <path d="M 850 620 Q 900 610 950 625 Q 1000 640 1050 615 Q 1100 590 1150 630 Q 1200 660 1280 600"
        stroke="#cc3333" stroke-width="2.5" fill="none" stroke-dasharray="8 4" stroke-linecap="round"/>

  <!-- commit 小旗 -->
  <line x1="1300" y1="560" x2="1300" y2="610" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 1300 560 L 1345 572 L 1300 584" fill="#cc3333" opacity="0.8" stroke="none"/>
  <text x="1312" y="576" font-family="Courier, monospace" font-size="11" fill="#ffffff" font-weight="700">commit</text>

  <!-- 手写标注 -->
  <text x="560" y="490" text-anchor="middle" font-family="PingFang SC, STKaiti, serif" font-size="17" fill="#A07848">停下排查</text>
  <path d="M 530 494 L 595 494" stroke="#A07848" stroke-width="0.8" fill="none"/>

  <text x="1050" y="460" text-anchor="middle" font-family="PingFang SC, STKaiti, serif" font-size="17" fill="#cc3333">绕过</text>

  <text x="795" y="560" text-anchor="middle" font-family="PingFang SC, STKaiti, serif" font-size="16" fill="#cc3333">报错!</text>

  <text x="1280" y="560" font-family="PingFang SC, STKaiti, serif" font-size="14" fill="#cc3333">提交猜测</text>

  <text x="795" y="750" text-anchor="middle" font-family="PingFang SC, STKaiti, serif" font-size="16" fill="#4a7ab5">环境故障</text>
  <path d="M 765 755 L 830 755" stroke="#4a7ab5" stroke-width="0.8" fill="none"/>
</svg>
