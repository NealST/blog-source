<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- 工位桌（手绘抖动感） -->
  <path d="M 540 555 Q 542 553 600 550 L 840 550 Q 898 553 900 555 L 900 570 L 540 570 Z"
        stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 桌腿 -->
  <path d="M 560 570 L 558 710" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M 880 570 L 882 710" stroke="#1a1a1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <!-- 横撑 -->
  <path d="M 560 660 Q 720 665 882 660" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- Day 1 纸牌（立在桌上） -->
  <path d="M 680 470 L 680 545 M 760 470 L 760 545" stroke="#1a1a1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <rect x="670" y="455" width="100" height="85" rx="5" fill="#ffffff" stroke="#A07848" stroke-width="2.5"/>
  <text x="720" y="500" text-anchor="middle" font-family="Georgia, 'PingFang SC', serif" font-size="32" font-weight="800" fill="#A07848">Day 1</text>
  <path d="M 690 512 L 750 512" stroke="#A07848" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- 小黑坐桌前（正面微侧） -->
  <!-- 身体（椭圆坐姿） -->
  <path d="M 700 490 Q 670 495 665 520 Q 662 540 680 548 Q 700 555 720 548 Q 738 540 735 520 Q 732 495 700 490 Z"
        fill="#1a1a1a" stroke="none"/>
  <!-- 头 -->
  <circle cx="700" cy="462" r="24" fill="#1a1a1a"/>
  <!-- 左耳 -->
  <path d="M 682 445 L 678 422 L 692 440" fill="#1a1a1a" stroke="none"/>
  <!-- 右耳 -->
  <path d="M 718 445 L 722 422 L 708 440" fill="#1a1a1a" stroke="none"/>
  <!-- 眼睛 -->
  <circle cx="692" cy="462" r="3.5" fill="#ffffff"/>
  <circle cx="708" cy="462" r="3.5" fill="#ffffff"/>
  <!-- 小尾巴 -->
  <path d="M 735 530 Q 755 520 758 505 Q 760 495 752 490"
        stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 前腿搭在桌上 -->
  <path d="M 678 540 L 670 555" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 722 540 L 730 555" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 机械计数器（挂在上方空中） -->
  <rect x="610" y="260" width="200" height="80" rx="8" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- 计数器内分隔 -->
  <line x1="660" y1="265" x2="660" y2="335" stroke="#1a1a1a" stroke-width="1.2" opacity="0.5"/>
  <line x1="710" y1="265" x2="710" y2="335" stroke="#1a1a1a" stroke-width="1.2" opacity="0.5"/>
  <line x1="760" y1="265" x2="760" y2="335" stroke="#1a1a1a" stroke-width="1.2" opacity="0.5"/>
  <!-- 数字 -->
  <text x="635" y="315" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="42" font-weight="900" fill="#A07848">0</text>
  <text x="685" y="315" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="42" font-weight="900" fill="#A07848">8</text>
  <text x="735" y="315" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="42" font-weight="900" fill="#A07848">4</text>
  <text x="785" y="315" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="42" font-weight="900" fill="#A07848">7</text>
  <!-- 计数器小螺丝 -->
  <circle cx="618" cy="270" r="3" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <circle cx="802" cy="270" r="3" fill="none" stroke="#1a1a1a" stroke-width="1" opacity="0.4"/>
  <!-- 计数器挂线 -->
  <path d="M 710 260 L 710 240 Q 710 230 720 230" stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- 散落的问号纸张 -->
  <g transform="rotate(-12 560 530)">
    <rect x="545" y="515" width="35" height="28" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="562" y="535" text-anchor="middle" font-size="16" font-weight="700" fill="#cc3333">?</text>
  </g>
  <g transform="rotate(8 860 525)">
    <rect x="845" y="510" width="32" height="26" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
    <text x="861" y="528" text-anchor="middle" font-size="15" font-weight="700" fill="#cc3333">?</text>
  </g>
  <g transform="rotate(18 890 548)">
    <rect x="878" y="538" width="28" height="22" rx="2" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    <text x="892" y="553" text-anchor="middle" font-size="13" font-weight="700" fill="#cc3333" opacity="0.6">?</text>
  </g>

  <!-- 手写标注 -->
  <text x="710" y="240" text-anchor="middle" font-family="'PingFang SC', 'STKaiti', serif" font-size="17" fill="#1a1a1a" opacity="0.35" font-style="italic">↑ 第 847 次</text>

  <text x="1050" y="450" font-family="'PingFang SC', 'STKaiti', serif" font-size="24" fill="#4a7ab5">无状态</text>
  <path d="M 1045 456 Q 1070 460 1110 456" stroke="#4a7ab5" stroke-width="1" fill="none" stroke-linecap="round"/>

  <text x="1050" y="490" font-family="'PingFang SC', 'STKaiti', serif" font-size="15" fill="#1a1a1a" opacity="0.4">每次任务 = 重新入职</text>

  <text x="400" y="310" font-family="'PingFang SC', 'STKaiti', serif" font-size="18" fill="#cc3333">没有记忆</text>
  <path d="M 395 315 Q 420 320 465 315" stroke="#cc3333" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <!-- 小箭头指向计数器 -->
  <path d="M 470 308 L 605 290" stroke="#cc3333" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-dasharray="4 3"/>
</svg>
