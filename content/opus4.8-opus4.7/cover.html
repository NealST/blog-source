<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background: #111; 
    display: flex; flex-direction: column; align-items: center; 
    padding: 70px 20px 80px; 
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  .toolbar {
    margin-bottom: 24px;
    display: flex;
    gap: 12px;
  }
  button {
    padding: 8px 16px;
    background: #C4956A;
    border: none;
    border-radius: 4px;
    color: #1C1C1E;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #d4a76a; }
  
  .cover { 
    width: 900px; height: 383px; 
    position: relative; overflow: hidden; 
    border-radius: 8px; background: #1C1C1E; 
  }
  
  .hero-art { 
    position: absolute; right: 48px; top: 50%; transform: translateY(-50%); 
    z-index: 1; opacity: 0.75;
  }
  
  .brand {
    position: absolute; top: 32px; left: 60px; z-index: 3;
    display: flex; align-items: center; gap: 8px;
  }
  .brand svg { width: 22px; height: 22px; }
  .brand-text { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 2px; }
  
  .content { 
    position: absolute; inset: 0; 
    display: flex; flex-direction: column; justify-content: center; 
    padding: 0 380px 0 60px; z-index: 2; 
  }
  
  .kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #C4956A;
    text-transform: uppercase; padding-top: 10px; position: relative; margin-bottom: 18px;
  }
  .kicker::before {
    content: ''; position: absolute; top: 0; left: 0; width: 32px; height: 2px; background: #C4956A;
  }
  
  .title {
    font-size: 58px; font-weight: 800; letter-spacing: -0.022em; line-height: 1.15;
    color: #F2EDE3; margin-top: 0;
  }
  .title .hook { color: #C4956A; font-size: 68px; font-weight: 900; letter-spacing: -0.01em; }
  
  .lede {
    font-size: 18px; font-weight: 400; font-style: italic;
    color: rgba(255,255,255,0.55); margin-top: 24px; max-width: 520px; line-height: 1.5;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
  function flattenAlpha(canvas, bgColor) {
    const isTransparent = !bgColor || bgColor === 'transparent' || bgColor === 'rgba(0, 0, 0, 0)';
    const flat = document.createElement('canvas');
    flat.width = canvas.width; flat.height = canvas.height;
    const ctx = flat.getContext('2d');
    ctx.fillStyle = isTransparent ? '#1C1C1E' : bgColor;
    ctx.fillRect(0, 0, flat.width, flat.height);
    ctx.drawImage(canvas, 0, 0);
    return flat;
  }

  async function downloadCover(type) {
    const el = document.getElementById('cover-main');
    const origRadius = el.style.borderRadius;
    el.style.borderRadius = '0';
    const bg = getComputedStyle(el).backgroundColor;
    const raw = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: null });
    el.style.borderRadius = origRadius;
    
    const flat = flattenAlpha(raw, bg);
    
    if (type === 'main') {
      flat.toBlob(b => saveAs(b, "cover-main.png"));
    } else {
      // Crop secondary (200x200 from center originally, now from bottom left of title area)
      const cropped = document.createElement('canvas');
      cropped.width = 400; // 2x
      cropped.height = 400;
      const ctx = cropped.getContext('2d');
      // Crop coordinate: left 120 (60px*2), top 200 (100px*2)
      ctx.drawImage(flat, 120, 200, 400, 400, 0, 0, 400, 400);
      cropped.toBlob(b => saveAs(b, "cover-secondary.png"));
    }
  }
</script>
</head>
<body>
  <div class="toolbar">
    <button onclick="downloadCover('main')">下载头图 (900x383)</button>
    <button onclick="downloadCover('secondary')">下载次图 (200x200)</button>
  </div>
  
  <div class="cover" id="cover-main">
    <div class="hero-art">
      <!-- A network / node SVG for dynamic workflow & AI -->
      <svg width="320" height="260" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="40" stroke="rgba(255,255,255,0.4)" stroke-width="0.5" />
        <circle cx="50" cy="50" r="28" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" stroke-dasharray="2,2"/>
        <path d="M 50 10 L 50 90 M 10 50 L 90 50" stroke="rgba(196,149,106,0.3)" stroke-width="0.5" />
        <circle cx="50" cy="50" r="4" fill="#C4956A"/>
        
        <!-- Nodes -->
        <circle cx="50" cy="10" r="3" fill="#F2EDE3"/>
        <circle cx="85" cy="30" r="2" fill="rgba(255,255,255,0.5)"/>
        <circle cx="85" cy="70" r="2.5" fill="#F2EDE3"/>
        <circle cx="15" cy="30" r="3" fill="#F2EDE3"/>
        <circle cx="15" cy="70" r="2" fill="rgba(255,255,255,0.5)"/>
        
        <!-- Connections -->
        <path d="M 50 50 L 85 30 L 85 70 Z" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
        <path d="M 50 50 L 15 30 L 50 10 Z" stroke="rgba(196,149,106,0.5)" stroke-width="1" />
        <path d="M 50 50 L 15 70" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
      </svg>
    </div>
    
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none">
        <circle cx="13" cy="16" r="10" stroke="rgba(255,255,255,0.5)" stroke-width="2.2"/>
        <ellipse cx="13" cy="8.5" rx="7" ry="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"/>
        <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/>
        <polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/>
        <circle cx="16" cy="16.3" r="0.7" fill="#F2EDE3"/>
        <line x1="26" y1="4" x2="26" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
        <path d="M26 16 Q26 22 22 22" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
        <circle cx="26" cy="4" r="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
      </svg>
      <div class="brand-text">墨筝</div>
    </div>
    
    <div class="content">
      <div class="kicker">Model Update</div>
      <h1 class="title">Claude Opus <span class="hook">4.8</span><br/>带来了哪些改变？</h1>
      <p class="lede">深入解析：算力控制 / 极速模式 / 动态工作流，三大工程能力如何提升其实用价值。</p>
    </div>
  </div>
</body>
</html>
