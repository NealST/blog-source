<title id="06-fast-slow-title">Jev 与生成模型的快慢协同</title>
<desc id="06-fast-slow-desc">输入与上下文先交给只做快速判断的 Jev，业务代码据此选择轻量生成模型或慢推理模型及人工升级，结果转交或校验后才输出，敏感工具由代码的权限校验及沙箱提供硬边界而不是风险评分，本图省略反馈循环。</desc>

<marker id="jev06-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2C2A28"/></marker>
</defs>
<rect width="960" height="600" fill="#FFFFFF"/>
<text class="jev06-title" x="40" y="64">快判断，慢生成：控制权留在业务代码</text>
<g transform="scale(2)">
<g class="jev06-edge" data-edges="6">
<path d="M132 88 H164"/>

<text x="32" y="102">任务所需直接证据</text>
</g>
<g data-node="jev">
<rect class="jev06-focal" x="164" y="64" width="120" height="48" rx="4"/>

<text x="176" y="102">只判断，不生成</text>
</g>

<text x="176" y="190">简单任务 / 生成</text>
</g>

<rect class="jev06-node" x="328" y="152" width="132" height="64" rx="4"/>

</g>
