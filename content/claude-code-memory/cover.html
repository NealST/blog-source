<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面 - 我如何把持久记忆接入每一次 Claude Code 会话</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 80px; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.toolbar { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); padding: 12px 24px; display: flex; gap: 12px; z-index: 999; }
.toolbar button { padding: 8px 16px; border: none; border-radius: 6px; background: #C4956A; color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; }
.toolbar button:hover { background: #b8845a; }
.cover { width: 900px; height: 383px; position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 40px; }
.bg-dark { position: absolute; inset: 0; background: #1C1C1E; }
.bg-gradient { position: absolute; inset: 0; background: radial-gradient(ellipse at 25% 50%, rgba(196,149,106,0.08) 0%, transparent 55%), radial-gradient(ellipse at 85% 30%, rgba(168,201,127,0.05) 0%, transparent 50%); }

.content { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 380px 0 70px; z-index: 2; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #C4956A; text-transform: uppercase; padding-top: 10px; position: relative; }
.kicker::before { content: ''; position: absolute; top: 0; left: 0; width: 32px; height: 1px; background: #C4956A; }
.title { font-size: 46px; font-weight: 800; letter-spacing: -0.022em; line-height: 1.18; color: #F2EDE3; margin-top: 18px; }
.title .hook { color: #C4956A; font-weight: 900; }
.lede { font-size: 16px; font-weight: 400; font-style: italic; color: rgba(255,255,255,0.55); margin-top: 18px; max-width: 480px; line-height: 1.5; }

/* 右侧焦点视觉：记忆生命周期 SVG */
.hero-art { position: absolute; right: 56px; top: 50%; transform: translateY(-50%); z-index: 1; }

.brand { position: absolute; top: 20px; left: 24px; display: flex; align-items: center; gap: 8px; z-index: 3; }
.brand svg { width: 22px; height: 22px; }
.brand-text { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 1px; }

.subtitle { position: absolute; bottom: 24px; right: 30px; font-size: 12px; color: rgba(255,255,255,0.3); z-index: 3; }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="downloadCover('main')">下载头图 (900x383)</button>
  <button onclick="downloadCover('secondary')">下载次图 (200x200)</button>
</div>

<div class="cover" id="cover-main">
  <div class="bg-dark"></div>
  <div class="bg-gradient"></div>

  <!-- 右侧视觉：会话生命周期三节点 + 中央大脑 -->
  <div class="hero-art">
    <svg width="280" height="260" viewBox="0 0 280 260" xmlns="http://www.w3.org/2000/svg">
      <!-- 中央大脑：mem0 记忆库 -->
      <defs>
        <radialGradient id="brainGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#C4956A" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#C4956A" stop-opacity="0.08"/>
        </radialGradient>
      </defs>
      <circle cx="140" cy="130" r="64" fill="url(#brainGrad)" stroke="rgba(196,149,106,0.5)" stroke-width="1.5"/>
      <!-- 大脑内文字 -->
      <text x="140" y="124" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="2">MEMORY</text>
      <text x="140" y="146" text-anchor="middle" font-size="22" font-weight="800" fill="#F2EDE3" font-family="-apple-system">mem0</text>

      <!-- 三个 hook 节点 -->
      <!-- 1. SessionStart (左上) -->
      <circle cx="50" cy="50" r="26" fill="rgba(168,201,127,0.18)" stroke="#A8C97F" stroke-width="1.5"/>
      <text x="50" y="48" text-anchor="middle" font-size="9" font-weight="700" fill="#A8C97F">START</text>
      <text x="50" y="60" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">读</text>

      <!-- 2. UserPromptSubmit (左下) -->
      <circle cx="50" cy="210" r="26" fill="rgba(143,188,187,0.18)" stroke="#8FBCBB" stroke-width="1.5"/>
      <text x="50" y="208" text-anchor="middle" font-size="9" font-weight="700" fill="#8FBCBB">PROMPT</text>
      <text x="50" y="220" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">读</text>

      <!-- 3. SessionEnd (右) -->
      <circle cx="230" cy="130" r="26" fill="rgba(196,149,106,0.22)" stroke="#C4956A" stroke-width="1.5"/>
      <text x="230" y="128" text-anchor="middle" font-size="9" font-weight="700" fill="#C4956A">END</text>
      <text x="230" y="140" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.7)">写</text>

      <!-- 连接线（虚线表示流向） -->
      <path d="M76 50 Q 105 80 95 110" stroke="rgba(168,201,127,0.45)" stroke-width="1.3" fill="none" stroke-dasharray="3,3"/>
      <path d="M76 210 Q 105 175 95 150" stroke="rgba(143,188,187,0.45)" stroke-width="1.3" fill="none" stroke-dasharray="3,3"/>
      <path d="M204 130 L 184 130" stroke="rgba(196,149,106,0.65)" stroke-width="1.5" fill="none"/>
      <polygon points="184,130 190,127 190,133" fill="rgba(196,149,106,0.65)"/>

      <!-- 入箭头：读取方向 -->
      <polygon points="95,110 92,116 100,114" fill="rgba(168,201,127,0.55)"/>
      <polygon points="95,150 92,144 100,146" fill="rgba(143,188,187,0.55)"/>
    </svg>
  </div>

  <!-- 品牌角标 -->
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="13" cy="16" r="10" stroke="rgba(255,255,255,0.5)" stroke-width="2.2" fill="none"/>
      <ellipse cx="13" cy="8.5" rx="7" ry="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" fill="none"/>
      <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/>
      <polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/>
      <circle cx="16" cy="16.3" r="0.7" fill="#F2EDE3"/>
      <line x1="26" y1="4" x2="26" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
      <path d="M26 16 Q26 22 22 22" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="26" cy="4" r="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="brand-text">墨筝</span>
  </div>

  <!-- 内容 -->
  <div class="content">
    <div class="kicker">AI · CLAUDE CODE · MEMORY</div>
    <h1 class="title">给 Claude Code<br>装上 <span class="hook">永久记忆</span></h1>
    <p class="lede">入口召回，过程补召回，退出捕获——一套真正能跑通的 Hook 架构</p>
  </div>

  <div class="subtitle">Hooks + mem0 + Pinecone</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
function flattenAlpha(canvas, bgColor) {
  const isTransparent = !bgColor || bgColor === 'transparent' || bgColor === 'rgba(0, 0, 0, 0)';
  const flat = document.createElement('canvas');
  flat.width = canvas.width; flat.height = canvas.height;
  const ctx = flat.getContext('2d');
  ctx.fillStyle = isTransparent ? '#1C1C1E' : bgColor;
  ctx.fillRect(0, 0, flat.width, flat.height);
  ctx.drawImage(canvas, 0, 0);
  return flat;
}

async function renderSlide(el) {
  const origRadius = el.style.borderRadius;
  el.style.borderRadius = '0';
  const bgEl = el.querySelector('.bg-light, .bg-dark');
  const bg = bgEl ? getComputedStyle(bgEl).backgroundColor : getComputedStyle(el).backgroundColor;
  const raw = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: null });
  el.style.borderRadius = origRadius;
  return flattenAlpha(raw, bg);
}

async function downloadCover(type) {
  const el = document.getElementById('cover-main');
  const canvas = await renderSlide(el);

  if (type === 'main') {
    canvas.toBlob(blob => saveAs(blob, 'cover-900x383.png'), 'image/png');
  } else {
    const crop = document.createElement('canvas');
    crop.width = 400; crop.height = 400;
    const ctx = crop.getContext('2d');
    const sx = 80, sy = (canvas.height - 400) / 2;
    ctx.drawImage(canvas, sx, sy, 400, 400, 0, 0, 400, 400);
    crop.toBlob(blob => saveAs(blob, 'cover-200x200.png'), 'image/png');
  }
}
</script>
</body>
</html>
