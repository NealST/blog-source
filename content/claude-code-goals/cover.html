<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>封面 - 详解 Claude Code 的 /goal 命令</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; flex-direction: column; align-items: center; padding: 70px 20px 80px; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
.toolbar { position: fixed; top: 0; left: 0; right: 0; background: rgba(0,0,0,0.9); padding: 12px 24px; display: flex; gap: 12px; z-index: 999; }
.toolbar button { padding: 8px 16px; border: none; border-radius: 6px; background: #C4956A; color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; }
.toolbar button:hover { background: #b8845a; }
.cover { width: 900px; height: 383px; position: relative; overflow: hidden; border-radius: 8px; margin-bottom: 40px; }
.bg-dark { position: absolute; inset: 0; background: #1C1C1E; }
.bg-gradient { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 60%, rgba(196,149,106,0.08) 0%, transparent 60%), radial-gradient(ellipse at 85% 25%, rgba(168,201,127,0.05) 0%, transparent 50%); }

.content { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 360px 0 70px; z-index: 2; }
.kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: #C4956A; text-transform: uppercase; padding-top: 10px; position: relative; }
.kicker::before { content: ''; position: absolute; top: 0; left: 0; width: 32px; height: 1px; background: #C4956A; }
.title { font-size: 50px; font-weight: 800; letter-spacing: -0.022em; line-height: 1.15; color: #F2EDE3; margin-top: 18px; }
.title .cmd { color: #C4956A; font-family: 'JetBrains Mono', 'SF Mono', monospace; font-weight: 800; }
.lede { font-size: 16px; font-weight: 400; font-style: italic; color: rgba(255,255,255,0.55); margin-top: 18px; max-width: 440px; line-height: 1.5; }
.version-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 4px 10px; border-radius: 4px; background: rgba(196,149,106,0.12); border: 1px solid rgba(196,149,106,0.35); font-size: 11px; color: #C4956A; font-family: 'SF Mono', monospace; font-weight: 600; width: fit-content; }
.version-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #A8C97F; }

.hero-art { position: absolute; right: 40px; top: 50%; transform: translateY(-50%); z-index: 1; opacity: 0.9; }

.brand { position: absolute; top: 20px; left: 24px; display: flex; align-items: center; gap: 8px; z-index: 3; }
.brand svg { width: 22px; height: 22px; }
.brand-text { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5); letter-spacing: 1px; }

.subtitle { position: absolute; bottom: 24px; right: 30px; font-size: 12px; color: rgba(255,255,255,0.3); z-index: 3; }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="downloadCover('main')">下载头图 (900x383)</button>
  <button onclick="downloadCover('secondary')">下载次图 (200x200)</button>
</div>

<div class="cover" id="cover-main">
  <div class="bg-dark"></div>
  <div class="bg-gradient"></div>

  <!-- 右侧焦点视觉：循环评估示意 -->
  <div class="hero-art">
    <svg width="300" height="260" viewBox="0 0 300 260" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 终端窗口 -->
      <rect x="10" y="10" width="280" height="220" rx="12" fill="rgba(44,42,40,0.85)" stroke="rgba(196,149,106,0.3)" stroke-width="1.5"/>
      <rect x="10" y="10" width="280" height="30" rx="12" fill="rgba(28,28,30,0.95)"/>
      <rect x="10" y="28" width="280" height="12" fill="rgba(28,28,30,0.95)"/>
      <circle cx="28" cy="25" r="4.5" fill="#FF5F57"/>
      <circle cx="44" cy="25" r="4.5" fill="#FFBD2E"/>
      <circle cx="60" cy="25" r="4.5" fill="#28CA42"/>
      <text x="150" y="28" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.45)" font-family="monospace">claude code · v2.1.138</text>

      <!-- 终端内容：goal 命令 -->
      <text x="24" y="62" font-size="11" fill="#C4956A" font-family="monospace">›</text>
      <text x="38" y="62" font-size="11" fill="#F2EDE3" font-family="monospace">/goal all tests pass</text>
      <text x="24" y="82" font-size="10" fill="rgba(255,255,255,0.4)" font-family="monospace">turn 1  · evaluating...</text>
      <text x="24" y="98" font-size="10" fill="rgba(255,255,255,0.4)" font-family="monospace">turn 2  · 6 of 12 passing</text>
      <text x="24" y="114" font-size="10" fill="rgba(255,255,255,0.4)" font-family="monospace">turn 3  · 11 of 12 passing</text>
      <text x="24" y="130" font-size="10" fill="rgba(255,255,255,0.4)" font-family="monospace">turn 4  · fixing auth.spec</text>
      <text x="24" y="148" font-size="11" fill="#A8C97F" font-family="monospace">✓ goal reached  · 4 turns</text>

      <!-- 状态栏 -->
      <rect x="20" y="166" width="260" height="32" rx="6" fill="rgba(196,149,106,0.08)" stroke="rgba(196,149,106,0.25)" stroke-width="1"/>
      <text x="32" y="186" font-size="10" fill="#C4956A" font-family="monospace">● /goal active</text>
      <text x="270" y="186" text-anchor="end" font-size="10" fill="rgba(255,255,255,0.45)" font-family="monospace">12.4k tokens</text>

      <!-- 评估循环说明 -->
      <text x="150" y="220" text-anchor="middle" font-size="9" fill="rgba(196,149,106,0.65)" font-family="monospace">↻ evaluator loop</text>
    </svg>
  </div>

  <!-- 品牌角标 -->
  <div class="brand">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="13" cy="16" r="10" stroke="rgba(255,255,255,0.5)" stroke-width="2.2" fill="none"/>
      <ellipse cx="13" cy="8.5" rx="7" ry="1.5" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" fill="none"/>
      <ellipse cx="14" cy="17" rx="3.5" ry="2" fill="#C4956A"/>
      <polygon points="10,17 7.5,14.5 7.5,19.5" fill="#C4956A"/>
      <circle cx="16" cy="16.3" r="0.7" fill="#F2EDE3"/>
      <line x1="26" y1="4" x2="26" y2="16" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
      <path d="M26 16 Q26 22 22 22" stroke="rgba(255,255,255,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="26" cy="4" r="2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="brand-text">墨筝</span>
  </div>

  <div class="content">
    <div class="kicker">CLAUDE CODE · AGENTIC WORKFLOW</div>
    <h1 class="title"><span class="cmd">/goal</span><br>全自动编码循环</h1>
    <p class="lede">让 Agent 一轮接一轮干到收敛，把回车键还给开发者</p>
    <div class="version-badge"><span class="dot"></span>v2.1.138 · 2026.05.11</div>
  </div>

  <div class="subtitle">Long-running Agentic Coding</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
function flattenAlpha(canvas, bgColor) {
  const isTransparent = !bgColor || bgColor === 'transparent' || bgColor === 'rgba(0, 0, 0, 0)';
  const flat = document.createElement('canvas');
  flat.width = canvas.width; flat.height = canvas.height;
  const ctx = flat.getContext('2d');
  ctx.fillStyle = isTransparent ? '#1C1C1E' : bgColor;
  ctx.fillRect(0, 0, flat.width, flat.height);
  ctx.drawImage(canvas, 0, 0);
  return flat;
}

async function renderSlide(el) {
  const origRadius = el.style.borderRadius;
  el.style.borderRadius = '0';
  const bgEl = el.querySelector('.bg-light, .bg-dark');
  const bg = bgEl ? getComputedStyle(bgEl).backgroundColor : getComputedStyle(el).backgroundColor;
  const raw = await html2canvas(el, { scale: 2, useCORS: true, backgroundColor: null });
  el.style.borderRadius = origRadius;
  return flattenAlpha(raw, bg);
}

async function downloadCover(type) {
  const el = document.getElementById('cover-main');
  const canvas = await renderSlide(el);

  if (type === 'main') {
    canvas.toBlob(blob => saveAs(blob, 'cover-900x383.png'), 'image/png');
  } else {
    const crop = document.createElement('canvas');
    crop.width = 400; crop.height = 400;
    const ctx = crop.getContext('2d');
    const sx = 80, sy = (canvas.height - 400) / 2;
    ctx.drawImage(canvas, sx, sy, 400, 400, 0, 0, 400, 400);
    crop.toBlob(blob => saveAs(blob, 'cover-200x200.png'), 'image/png');
  }
}
</script>
</body>
</html>
