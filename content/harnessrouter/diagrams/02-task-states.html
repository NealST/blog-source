<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一次任务的五种状态</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Geist', 'PingFang SC', sans-serif; background: #FFFFFF; color: #1C1C1E; padding: 48px 32px; }
.frame { max-width: 1000px; margin: 0 auto; }
.diagram-container { width: 100%; overflow-x: auto; }
#uhpst-svg { width: 100%; min-width: 960px; display: block; background: #FFFFFF; }
#uhpst-svg text { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #1C1C1E; letter-spacing: 0; }
#uhpst-svg .t { font-family: 'Instrument Serif', 'PingFang SC', serif; font-size: 28px; }
#uhpst-svg .nm { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 600; }
#uhpst-svg .sub { font-size: 8px; font-weight: 500; fill: #7A7876; }
#uhpst-svg .cn { font-size: 8px; font-weight: 500; fill: #7A7876; }
#uhpst-svg .run { fill: #FFFFFF; stroke: #1C1C1E; stroke-width: 1; }
#uhpst-svg .term { fill: rgba(28,28,30,0.05); stroke: #7A7876; stroke-width: 1; }
#uhpst-svg .focal { fill: rgba(196,149,106,0.10); stroke: #C4956A; stroke-width: 1; }
#uhpst-svg .edge { fill: none; stroke: #7A7876; stroke-width: 1; marker-end: url(#uhpst-arrow); }
#uhpst-svg .edge-accent { fill: none; stroke: #C4956A; stroke-width: 1; marker-end: url(#uhpst-arrow-accent); }
#uhpst-svg .loop { fill: none; stroke: #7A7876; stroke-width: 1; stroke-dasharray: 3,2; }
#uhpst-svg .mask { fill: #FFFFFF; }
@media print { .diagram-container { overflow-x: visible; } #uhpst-svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
<div class="diagram-container">
<svg id="uhpst-svg" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uhpst-title uhpst-desc">
<title id="uhpst-title">UHP 任务的五种状态</title>
<desc id="uhpst-desc">任务提交后进入 in_progress，再按不同条件进入四种终态：正常结束为 completed，达到步数上限或超时为 incomplete，调用方主动取消为 cancelled，执行异常为 failed；客户端断开流式连接不会改变任务状态。</desc>
<defs>
<marker id="uhpst-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7A7876"/></marker>
<marker id="uhpst-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C4956A"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="t" x="40" y="60">一次任务的五种状态</text>
<g transform="scale(2)">

<path class="edge" d="M34 150 H72"/>
<path class="edge" d="M172 136 H228 Q232 136 232 132 V80 Q232 76 236 76 H300"/>
<path class="edge" d="M172 146 H240 Q244 146 244 142 V136 Q244 132 248 132 H300"/>
<path class="edge" d="M172 156 H240 Q244 156 244 160 V184 Q244 188 248 188 H300"/>
<path class="edge-accent" d="M172 166 H228 Q232 166 232 170 V240 Q232 244 236 244 H300"/>
<path class="loop" d="M100 126 C100 98 144 98 144 126"/>

<rect class="mask" x="43" y="128" width="20" height="14" rx="2"/>
<text class="cn" x="53" y="138" text-anchor="middle">提交</text>
<rect class="mask" x="250" y="54" width="36" height="14" rx="2"/>
<text class="cn" x="268" y="64" text-anchor="middle">正常完成</text>
<rect class="mask" x="252" y="110" width="44" height="14" rx="2"/>
<text class="cn" x="274" y="120" text-anchor="middle">步数或超时</text>
<rect class="mask" x="256" y="166" width="36" height="14" rx="2"/>
<text class="cn" x="274" y="176" text-anchor="middle">主动取消</text>
<rect class="mask" x="250" y="222" width="36" height="14" rx="2"/>
<text class="cn" x="268" y="232" text-anchor="middle">执行异常</text>
<rect class="mask" x="78" y="84" width="88" height="14" rx="2"/>
<text class="cn" x="122" y="94" text-anchor="middle">SSE 断开，状态不变</text>

<circle cx="28" cy="150" r="3" fill="#1C1C1E"/>

<rect class="mask" x="72" y="126" width="100" height="48" rx="8"/>
<rect class="run" x="72" y="126" width="100" height="48" rx="8"/>
<text class="nm" x="122" y="148" text-anchor="middle">in_progress</text>
<text class="sub" x="122" y="162" text-anchor="middle">执行中</text>

<rect class="mask" x="300" y="56" width="108" height="40" rx="8"/>
<rect class="term" x="300" y="56" width="108" height="40" rx="8"/>
<text class="nm" x="354" y="74" text-anchor="middle">completed</text>
<text class="sub" x="354" y="88" text-anchor="middle">执行完毕</text>

<rect class="mask" x="300" y="112" width="108" height="40" rx="8"/>
<rect class="term" x="300" y="112" width="108" height="40" rx="8"/>
<text class="nm" x="354" y="130" text-anchor="middle">incomplete</text>
<text class="sub" x="354" y="144" text-anchor="middle">预算用尽而停止</text>

<rect class="mask" x="300" y="168" width="108" height="40" rx="8"/>
<rect class="term" x="300" y="168" width="108" height="40" rx="8"/>
<text class="nm" x="354" y="186" text-anchor="middle">cancelled</text>
<text class="sub" x="354" y="200" text-anchor="middle">调用方取消</text>

<rect class="mask" x="300" y="224" width="108" height="40" rx="8"/>
<rect class="focal" x="300" y="224" width="108" height="40" rx="8"/>
<text class="nm" x="354" y="242" text-anchor="middle">failed</text>
<text class="sub" x="354" y="256" text-anchor="middle">执行失败</text>

<line x1="16" y1="278" x2="464" y2="278" stroke="rgba(28,28,30,0.16)" stroke-width="1"/>
<text class="cn" x="16" y="292">任务失败时 HTTP 仍可能返回 200，必须读 Response 的 status，不能只看状态码</text>
</g>
</svg>
</div>
</div>
</body>
</html>
