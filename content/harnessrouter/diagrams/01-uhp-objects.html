<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一次任务落在哪些对象上</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Geist', 'PingFang SC', sans-serif; background: #FFFFFF; color: #1C1C1E; padding: 48px 32px; }
.frame { max-width: 1000px; margin: 0 auto; }
.diagram-container { width: 100%; overflow-x: auto; }
#uhpobj-svg { width: 100%; min-width: 960px; display: block; background: #FFFFFF; }
#uhpobj-svg text { font-family: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #1C1C1E; letter-spacing: 0; }
#uhpobj-svg .t { font-family: 'Instrument Serif', 'PingFang SC', serif; font-size: 28px; }
#uhpobj-svg .nm { font-size: 12px; font-weight: 600; }
#uhpobj-svg .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; fill: #7A7876; }
#uhpobj-svg .cn { font-size: 8px; font-weight: 500; fill: #7A7876; }
#uhpobj-svg .zone-nm { font-size: 12px; font-weight: 600; fill: #1C1C1E; }
#uhpobj-svg .input { fill: rgba(122,120,118,0.10); stroke: #8C8A87; stroke-width: 1; }
#uhpobj-svg .opt { fill: rgba(28,28,30,0.02); stroke: rgba(28,28,30,0.20); stroke-width: 1; stroke-dasharray: 3,2; }
#uhpobj-svg .zone { fill: rgba(196,149,106,0.10); stroke: #C4956A; stroke-width: 1; }
#uhpobj-svg .node { fill: #FFFFFF; stroke: #1C1C1E; stroke-width: 1; }
#uhpobj-svg .store { fill: rgba(28,28,30,0.05); stroke: #7A7876; stroke-width: 1; }
#uhpobj-svg .edge { fill: none; stroke: #7A7876; stroke-width: 1; marker-end: url(#uhpobj-arrow); }
#uhpobj-svg .mask { fill: #FFFFFF; }
@media print { .diagram-container { overflow-x: visible; } #uhpobj-svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
<div class="diagram-container">
<svg id="uhpobj-svg" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="uhpobj-title uhpobj-desc">
<title id="uhpobj-title">UHP 的一次任务落在哪些对象上</title>
<desc id="uhpobj-desc">Harness 配置绑定一个 Session，Environment 与 Memory 以只读方式挂载；Session 内按顺序排列多次 Response，后一次通过 previous_response_id 续接前一次；输入文件进入任务，Agent 生成的产物归集到 Container。</desc>
<defs>
<marker id="uhpobj-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7A7876"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text class="t" x="40" y="60">一次任务落在哪些对象上</text>
<g transform="scale(2)">

<path class="edge" d="M120 80 H148"/>
<path class="edge" d="M120 158 H148"/>
<path class="edge" d="M252 124 H288"/>
<path class="edge" d="M206 212 V152"/>
<path class="edge" d="M338 148 V212"/>

<rect class="mask" x="126" y="62" width="20" height="14" rx="2"/>
<text class="cn" x="136" y="72" text-anchor="middle">绑定</text>
<rect class="mask" x="126" y="140" width="20" height="14" rx="2"/>
<text class="cn" x="136" y="150" text-anchor="middle">挂载</text>
<rect class="mask" x="262" y="106" width="20" height="14" rx="2"/>
<text class="cn" x="272" y="116" text-anchor="middle">续接</text>
<rect class="mask" x="214" y="174" width="20" height="14" rx="2"/>
<text class="cn" x="224" y="184" text-anchor="middle">输入</text>
<rect class="mask" x="346" y="174" width="20" height="14" rx="2"/>
<text class="cn" x="356" y="184" text-anchor="middle">产物</text>

<rect class="zone" x="152" y="40" width="240" height="144" rx="8"/>
<text class="zone-nm" x="168" y="64">Session 会话</text>
<text class="sub" x="168" y="80">context + working directory</text>

<rect class="mask" x="16" y="56" width="104" height="48" rx="6"/>
<rect class="input" x="16" y="56" width="104" height="48" rx="6"/>
<text class="nm" x="68" y="80" text-anchor="middle">Harness 配置</text>
<text class="sub" x="68" y="94" text-anchor="middle">chrn_...</text>

<rect class="mask" x="16" y="136" width="104" height="44" rx="6"/>
<rect class="opt" x="16" y="136" width="104" height="44" rx="6"/>
<text class="nm" x="68" y="158" text-anchor="middle">Environment</text>
<text class="sub" x="68" y="172" text-anchor="middle">+ Memory</text>

<rect class="mask" x="160" y="100" width="92" height="48" rx="6"/>
<rect class="node" x="160" y="100" width="92" height="48" rx="6"/>
<text class="nm" x="206" y="124" text-anchor="middle">Response</text>
<text class="sub" x="206" y="138" text-anchor="middle">resp_a1b2c3</text>

<rect class="mask" x="292" y="100" width="92" height="48" rx="6"/>
<rect class="node" x="292" y="100" width="92" height="48" rx="6"/>
<text class="nm" x="338" y="124" text-anchor="middle">Response</text>
<text class="sub" x="338" y="138" text-anchor="middle">resp_d4e5f6</text>

<rect class="mask" x="160" y="212" width="92" height="44" rx="6"/>
<rect class="store" x="160" y="212" width="92" height="44" rx="6"/>
<text class="nm" x="206" y="234" text-anchor="middle">File 输入</text>
<text class="sub" x="206" y="248" text-anchor="middle">file_id</text>

<rect class="mask" x="292" y="212" width="92" height="44" rx="6"/>
<rect class="store" x="292" y="212" width="92" height="44" rx="6"/>
<text class="nm" x="338" y="234" text-anchor="middle">Container 产物</text>
<text class="sub" x="338" y="248" text-anchor="middle">container_id</text>

<line x1="16" y1="272" x2="464" y2="272" stroke="rgba(28,28,30,0.16)" stroke-width="1"/>
<text class="cn" x="16" y="286">同一个 Session 内的多次 Response 共享上下文与工作目录，后一次用 previous_response_id 续接前一次</text>
</g>
</svg>
</div>
</div>
</body>
</html>
